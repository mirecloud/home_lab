kube-prometheus-stack:
  grafana:
    enabled: true

    envFromSecret: grafana-keycloak-secret

    sidecar:
      datasources:
        enabled: true
        initDatasources: true
        skipReload: false

    grafana.ini:
      server:
        domain: grafana.mirecloud.com
        root_url: "https://grafana.mirecloud.com"

      log:
        level: debug
        mode: console
        format: json

      auth:
        disable_login_form: false
        oauth_auto_login: false
        log_token_exchange: true
        log_user_id: true

      auth.generic_oauth:
        enabled: true
        name: "Keycloak"
        debug: true
        client_id: "grafana"
        client_secret: $__env{client_secret}
        scopes: "openid profile email"
        use_pkce: true
        tls_skip_verify_insecure: true

        auth_url: "https://keycloak.mirecloud.com/auth/realms/mirecloud/protocol/openid-connect/auth"
        token_url: "https://keycloak.mirecloud.com/auth/realms/mirecloud/protocol/openid-connect/token"
        api_url: "https://keycloak.mirecloud.com/auth/realms/mirecloud/protocol/openid-connect/userinfo"

        role_attribute_path: "contains(realm_access.roles[*], 'admin') && 'Admin' || 'Viewer'"
        role_attribute_strict: true

    ingress:
      enabled: false

  prometheus:
    ingress:
      enabled: false

    prometheusSpec:
      additionalScrapeConfigs:
        - job_name: proxmox
          scrape_interval: 30s
          scrape_timeout: 25s
          metrics_path: /pve

          params:
            module:
              - default
            cluster:
              - "1"
            node:
              - "1"

          static_configs:
            - targets:
                - "192.168.2.124"

          relabel_configs:
            - source_labels:
                - __address__
              target_label: __param_target

            - source_labels:
                - __param_target
              target_label: instance

            - target_label: __address__
              replacement: "192.168.2.124:9221"