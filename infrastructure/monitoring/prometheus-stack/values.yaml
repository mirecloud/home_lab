kube-prometheus-stack:
  grafana:
    enabled: true
    # Assure-toi que ce secret existe et contient bien la clé "client_secret"
    envFromSecret: grafana-keycloak-secret

    grafana.ini:
      server:
        domain: grafana.mirecloud.com
        root_url: "https://grafana.mirecloud.com"

      log:
        level: debug
        mode: console
        format: json

      auth:
        disable_login_form: false
        oauth_auto_login: false
        log_token_exchange: true
        log_user_id: true

      auth.generic_oauth:
        enabled: true
        name: "Keycloak"
        debug: true
        client_id: "grafana"
        client_secret: $__env{client_secret}
        scopes: "openid profile email"
        # FIX : Activation du PKCE pour correspondre à la config Keycloak
        use_pkce: true
        tls_skip_verify_insecure: true

        # FIX : URLs Publiques uniquement (Évite le Issuer Mismatch)
        auth_url: "https://keycloak.mirecloud.com/auth/realms/mirecloud/protocol/openid-connect/auth"
        token_url: "https://keycloak.mirecloud.com/auth/realms/mirecloud/protocol/openid-connect/token"
        api_url: "https://keycloak.mirecloud.com/auth/realms/mirecloud/protocol/openid-connect/userinfo"

        role_attribute_path: "contains(realm_access.roles[*], 'admin') && 'Admin' || 'Viewer'"
        role_attribute_strict: true

    ingress:
      enabled: false

  prometheus:
    ingress:
      enabled: false