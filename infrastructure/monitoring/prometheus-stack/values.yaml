kube-prometheus-stack:
  grafana:
    enabled: true
    envFromSecret: grafana-keycloak-secret

    grafana.ini:
      server:
        domain: grafana.mirecloud.com
        root_url: "https://grafana.mirecloud.com"
        serve_from_sub_path: false
      auth:
        disable_login_form: false
        oauth_auto_login: false
      auth.generic_oauth:
        enabled: true
        name: "Keycloak"
        tls_skip_verify_insecure: true
        client_id: "grafana"
        client_secret: $__env{client_secret}

        # -----------------------------------------------------------
        # 1. URL PUBLIQUE (Front-channel)
        # C'est l'URL que ton navigateur utilise.
        #  CORRECTION : Suppression du "/auth"
        # -----------------------------------------------------------
        auth_url: "https://keycloak.mirecloud.com/realms/mirecloud/protocol/openid-connect/auth"

        # -----------------------------------------------------------
        # 2. URLs INTERNES (Back-channel)
        # C'est l'URL que le POD Grafana utilise pour parler au POD Keycloak.
        # On passe par le service interne (http) pour éviter les erreurs SSL/DNS.
        #  CORRECTION : Suppression du "/auth" + Passage en interne
        # -----------------------------------------------------------
        token_url: "http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/realms/mirecloud/protocol/openid-connect/token"
        api_url: "http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/realms/mirecloud/protocol/openid-connect/userinfo"

        scopes: "openid profile email"
        allow_sign_up: true
        role_attribute_path: "contains(realm_access.roles[*], 'admin') && 'Admin' || 'Viewer'"

    ingress:
      enabled: false

  prometheus:
    ingress:
      enabled: false
