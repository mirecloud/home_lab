loki:
  # --- 1. Configs à la racine du sous-chart ---
  deploymentMode: SingleBinary

  # --- 2. LE BLOC CRITIQUE (La "Double Loki") ---
  loki:
    auth_enabled: false
    limits_config:
      retention_period: 168h

  # --- CORRECTION : Les blocs suivants sont des helpers du Chart ---
  # Ils doivent être à la racine du sous-chart (niveau 'deploymentMode')
  # et NON imbriqués dans la section 'loki' (qui est pour la config brute).

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  # --- 3. Retour à la racine pour les composants ---
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
      accessModes:
        - ReadWriteOnce

  # Désactivation des composants
  write: { replicas: 0 }
  read: { replicas: 0 }
  backend: { replicas: 0 }
  minio: { enabled: false }
  gateway:
    enabled: true
    service: { type: ClusterIP }
  monitoring:
    selfMonitoring: { enabled: false }
    grafanaAgent: { installOperator: false }
  test: { enabled: false }

promtail:
  enabled: true
  config:
    clients:
      - url: http://loki-stack-loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push
