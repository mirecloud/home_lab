###############################################################################
# LOKI (Wrapper Configuration)
###############################################################################
loki:
  # --- Configs à la racine du sous-chart ---
  deploymentMode: SingleBinary

  # --- Configs internes ("Double Loki") ---
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1

    # 👇 ON PASSE EN MODE S3 (MinIO)
    storage:
      type: s3
      bucketNames:
        chunks: chunks
        ruler: ruler
        admin: admin
      s3:
        # L'adresse IP de ton node-3 (API Port 9000)
        endpoint: http://192.168.2.74:9000
        # Tes credentials MinIO (vérifie /etc/default/minio sur node-3)
        accessKeyId: admin
        secretAccessKey: password
        # Paramètres obligatoires pour MinIO
        s3ForcePathStyle: true
        insecure: true

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3 # <--- Changement ici : s3 au lieu de filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

  # --- Retour à la racine ---
  singleBinary:
    replicas: 1
    persistence:
      # On garde la persistance pour le WAL (Write Ahead Log), mais les données vont dans MinIO
      enabled: true
      size: 10Gi
      accessModes:
        - ReadWriteOnce

  # Désactivation des composants
  write: { replicas: 0 }
  read: { replicas: 0 }
  backend: { replicas: 0 }

  gateway:
    enabled: true
    service:
      type: ClusterIP

  # Désactivation des extras
  minio: { enabled: false } # On utilise ton MinIO externe, pas celui du chart
  monitoring:
    selfMonitoring: { enabled: false }
    grafanaAgent: { installOperator: false }
  test: { enabled: false }

###############################################################################
# PROMTAIL
###############################################################################
promtail:
  enabled: true

  # 👇 1. On donne accès au dossier physique des logs d'audit à Promtail
  extraVolumes:
    - name: audit-logs
      hostPath:
        path: /var/log/kubernetes/audit
  extraVolumeMounts:
    - name: audit-logs
      mountPath: /var/log/kubernetes/audit
      readOnly: true

  config:
    clients:
      # 👇 LE VRAI NOM DU SERVICE EST "loki-stack-gateway"
      - url: http://loki-stack-gateway.monitoring.svc.cluster.local/loki/api/v1/push

    # 👇 2. On apprend à Promtail à scraper et décoder l'audit Kubernetes
    snippets:
      extraScrapeConfigs: |
        - job_name: kubernetes-audit
          static_configs:
            - targets:
                - localhost
              labels:
                job: kubernetes-audit
                __path__: /var/log/kubernetes/audit/*.log
          pipeline_stages:
            - json:
                expressions:
                  audit_user: user.username
                  audit_verb: verb
                  audit_namespace: objectRef.namespace
                  audit_resource: objectRef.resource
            - labels:
                audit_user:
                audit_verb:
                audit_namespace:
                audit_resource:
