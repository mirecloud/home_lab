apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-ui-tls-cert
  namespace: vault
spec:
  secretName: vault-ui -tls-secret
  issuerRef:
    name: mirecloud-ca-issuer
    kind: ClusterIssuer
  commonName: vault-ui.mirecloud.com
  dnsNames:
    - vault-ui.mirecloud.com

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: vault-ui-gateway
  namespace: vault
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: vault-ui-tls-secret
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-ui-route
  namespace: vault
spec:
  parentRefs:
    - name: vault-ui-gateway
      sectionName: https
  hostnames:
    - vault-ui.mirecloud.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name:   vault-ui
          port: 8200