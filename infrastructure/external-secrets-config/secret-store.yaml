apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200" # <-- C'est ici qu'on corrige (vault au lieu de vault-active)
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "vault-backend"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
