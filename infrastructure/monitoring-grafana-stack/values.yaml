grafana:
  enabled: true

  # 1. Injection du Secret (Indispensable pour le client_secret)
  envFromSecret: grafana-keycloak-secret

  # 2. Configuration des Sources de Données (LGTM)
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          uid: loki
          type: loki
          url: http://{{ .Release.Name }}-loki-gateway
          isDefault: false
        - name: Mimir
          uid: prom
          type: prometheus
          url: http://{{ .Release.Name }}-mimir-nginx/prometheus
          isDefault: true
        - name: Tempo
          uid: tempo
          type: tempo
          url: http://{{ .Release.Name }}-tempo-query-frontend:3200
          isDefault: false
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
            lokiSearch:
              datasourceUid: loki
            tracesToMetrics:
              datasourceUid: prom
            serviceMap:
              datasourceUid: prom

  # 3. Configuration Keycloak (SSO) - C'est ici que j'avais oublié !
  grafana.ini:
    server:
      domain: grafana.mirecloud.com
      root_url: "https://grafana.mirecloud.com"
      serve_from_sub_path: false
    auth:
      disable_login_form: false
      oauth_auto_login: false
    auth.generic_oauth:
      enabled: true
      name: "Keycloak"
      tls_skip_verify_insecure: true
      client_id: "grafana"
      client_secret: $__env{client_secret}

      # URL PUBLIQUE (Front) : Avec /auth (requis par votre version)
      auth_url: "https://keycloak.mirecloud.com/auth/realms/mirecloud/protocol/openid-connect/auth"

      # URL INTERNE (Back) : Avec /auth et via ClusterIP (http)
      token_url: "http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/mirecloud/protocol/openid-connect/token"
      api_url: "http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/mirecloud/protocol/openid-connect/userinfo"

      scopes: "openid profile email"
      allow_sign_up: true
      role_attribute_path: "contains(realm_access.roles[*], 'admin') && 'Admin' || 'Viewer'"

  # Désactivation de l'Ingress (car on utilise Gateway API)
  ingress:
    enabled: false

# --- Le reste de la stack LGTM ---
loki:
  enabled: true

mimir:
  enabled: true
  alertmanager:
    resources:
      requests:
        cpu: 20m
  compactor:
    resources:
      requests:
        cpu: 20m
  distributor:
    resources:
      requests:
        cpu: 20m
  ingester:
    replicas: 2
    zoneAwareReplication:
      enabled: false
    resources:
      requests:
        cpu: 20m
  overrides_exporter:
    resources:
      requests:
        cpu: 20m
  querier:
    replicas: 1
    resources:
      requests:
        cpu: 20m
  query_frontend:
    resources:
      requests:
        cpu: 20m
  query_scheduler:
    replicas: 1
    resources:
      requests:
        cpu: 20m
  ruler:
    resources:
      requests:
        cpu: 20m
  store_gateway:
    zoneAwareReplication:
      enabled: false
    resources:
      requests:
        cpu: 20m
  minio:
    resources:
      requests:
        cpu: 20m
  rollout_operator:
    resources:
      requests:
        cpu: 20m

tempo:
  enabled: true
  ingester:
    replicas: 1

grafana-oncall:
  enabled: false
