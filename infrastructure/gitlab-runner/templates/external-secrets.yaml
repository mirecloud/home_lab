# Prérequis Vault (même chemin que le CA déjà utilisé par apps/gitlab) :
#   vault kv patch secret/gitlab/runner runner_token=glrt-xxxxxxxx
# (ca_cert y est déjà)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-token-es
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-runner-token # référencé par gitlab-runner.runners.secret
    template:
      data:
        runner-token: "{{`{{ .runnerToken }}`}}"
        runner-registration-token: "" # le chart monte cette clé même si inutilisée
  data:
  - secretKey: runnerToken
    remoteRef:
      key: secret/gitlab/runner
      property: runner_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-certs-es
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-runner-certs # référencé par gitlab-runner.certsSecretName
  data:
  - secretKey: gitlab.mirecloud.com.crt # nom imposé : <hostname>.crt
    remoteRef:
      key: secret/gitlab/runner
      property: ca_cert
