apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 1.2.0
    helm:
      values: |
        installCRDs: true

        replicaCount: 1

        openshiftFinalizers: true

        log:
          level: info

        serviceAccount:
          create: true
          name: external-secrets

        securityContext:
          enabled: true
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true

        webhook:
          create: true
          failurePolicy: Fail

        certController:
          create: true

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
