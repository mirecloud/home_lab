apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ext-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/mirecloud/home_lab.git"
    targetRevision: HEAD
    path: apps/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
