apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "git@github.com:mirecloud/home_lab.git"
    targetRevision: HEAD
    # On pointe vers TON dossier propre (sans templates)
    path: infrastructure/external-secrets
  destination:
    server: https://kubernetes.default.svc
    # ArgoCD créera le namespace s'il n'existe pas
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
