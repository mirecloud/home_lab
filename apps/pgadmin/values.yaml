# -------------------------------------------------------------------
# Configuration pour le sous-chart "pgadmin4"
# TOUT ce qui concerne l'appli doit être indenté sous cette clé !
# -------------------------------------------------------------------
pgadmin4:
  env:
    email: "admin@mirecloud.com"
    contextPath: "/"

  # On injecte le secret créé par ExternalSecrets
  extraEnv:
    - name: PGADMIN_DEFAULT_PASSWORD
      valueFrom:
        secretKeyRef:
          name: pgadmin-admin-password
          key: password

  # Configuration Ingress (C'est ici qu'on l'active pour de vrai)
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "mirecloud-ca-issuer"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    hosts:
      - host: pgadmin.mirecloud.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: pgadmin-tls
        hosts:
          - pgadmin.mirecloud.com

  # Persistance
  persistentVolume:
    enabled: true
    size: 5Gi
# -------------------------------------------------------------------
# Ici, on pourrait mettre des valeurs globales si nécessaire
# Mais pour l'instant, c'est vide.
# -------------------------------------------------------------------
