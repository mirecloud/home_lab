pgadmin4:
  env:
    email: "info@mirecloud.com"
    contextPath: "" # <--- METS JUSTE DES GUILLEMETS VIDES ICI (au lieu de "/")

  extraEnv:
    - name: PGADMIN_DEFAULT_PASSWORD
      valueFrom:
        secretKeyRef:
          name: pgadmin-admin-password
          key: password

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "mirecloud-ca-issuer"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    hosts:
      - host: pgadmin.mirecloud.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: pgadmin-tls
        hosts:
          - pgadmin.mirecloud.com

  persistentVolume:
    enabled: true
    size: 5Gi
