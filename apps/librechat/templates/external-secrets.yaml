# ============================================================================
#  Secret unique LibreChat (envs requis + secrets OIDC) — synchronisé depuis Vault
#  Vault path attendu : secret/librechat/env  avec les propriétés :
#    CREDS_KEY, CREDS_IV, JWT_SECRET, JWT_REFRESH_SECRET, MEILI_MASTER_KEY,
#    OPENID_CLIENT_SECRET, OPENID_SESSION_SECRET
# ============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-credentials-env
  namespace: librechat
  labels:
    app: librechat
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: librechat-credentials-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CREDS_KEY
      remoteRef:
        key: secret/librechat/env
        property: CREDS_KEY
    - secretKey: CREDS_IV
      remoteRef:
        key: secret/librechat/env
        property: CREDS_IV
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/librechat/env
        property: JWT_SECRET
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: secret/librechat/env
        property: JWT_REFRESH_SECRET
    - secretKey: MEILI_MASTER_KEY
      remoteRef:
        key: secret/librechat/env
        property: MEILI_MASTER_KEY
    - secretKey: OPENID_CLIENT_SECRET
      remoteRef:
        key: secret/librechat/env
        property: OPENID_CLIENT_SECRET
    - secretKey: OPENID_SESSION_SECRET
      remoteRef:
        key: secret/librechat/env
        property: OPENID_SESSION_SECRET

---
# ============================================================================
#  CA interne MireCloud (pour NODE_EXTRA_CA_CERTS → confiance TLS Keycloak)
# ============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mirecloud-ca-sync
  namespace: librechat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mirecloud-ca-cert
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: secret/mirecloud/ca
        property: tls.crt
