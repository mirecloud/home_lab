# ============================================================================
#  Valeurs globales — propagées à TOUS les sous-charts (Helm `global`)
#  Doit rester au niveau racine (pas sous `librechat:`) pour être global.
# ============================================================================
global:
  librechat:
    # Secret unique qui porte TOUS les envs/mots de passe requis :
    #   CREDS_KEY, CREDS_IV, JWT_SECRET, JWT_REFRESH_SECRET, MEILI_MASTER_KEY
    #   + OPENID_CLIENT_SECRET, OPENID_SESSION_SECRET
    # Créé par templates/external-secrets.yaml (depuis Vault).
    existingSecretName: "librechat-credentials-env"
    existingSecretApiKey: OPENAI_API_KEY

# ============================================================================
#  Valeurs du sous-chart `librechat` (oci://ghcr.io/danny-avila/librechat-chart)
# ============================================================================
librechat:
  librechat:
    # URL publique (utilisée pour les redirections OAuth/SSO)
    adminPanelUrl: ""

    # ------------------------------------------------------------------
    #  Variables d'environnement de config (ConfigMap → envFrom)
    #  Les SECRETS (client-secret, session-secret) viennent, eux, du
    #  Secret `librechat-credentials-env` (voir external-secrets.yaml).
    # ------------------------------------------------------------------
    configEnv:
      # --- Domaine public ---
      DOMAIN_CLIENT: "https://librechat.mirecloud.com"
      DOMAIN_SERVER: "https://librechat.mirecloud.com"

      # --- Inscriptions / login ---
      ALLOW_REGISTRATION: "true"
      ALLOW_EMAIL_LOGIN: "true"
      ALLOW_SOCIAL_LOGIN: "true"
      ALLOW_SOCIAL_REGISTRATION: "true"

      # --- SSO OpenID (Keycloak / realm mirecloud) ---
      OPENID_ISSUER: "https://keycloak.mirecloud.com/auth/realms/mirecloud"
      OPENID_CLIENT_ID: "librechat"
      OPENID_SCOPE: "openid profile email"
      OPENID_CALLBACK_URL: "/oauth/openid/callback"
      OPENID_BUTTON_LABEL: "Keycloak"
      OPENID_AUTO_REDIRECT: "false"
      # OPENID_CLIENT_SECRET  → injecté depuis le Secret
      # OPENID_SESSION_SECRET → injecté depuis le Secret

      # --- CA interne (Vault) pour que Node fasse confiance à Keycloak en HTTPS ---
      NODE_EXTRA_CA_CERTS: "/etc/ssl/certs/vault-ca.crt"

    existingSecretName: "librechat-credentials-env"

    # ------------------------------------------------------------------
    #  librechat.yaml — branche les endpoints custom (vLLM + RAG)
    # ------------------------------------------------------------------
    configYamlContent: |
      version: 1.2.8
      cache: true
      endpoints:
        custom:
          # --- vLLM : chat Qwen3-14B abliterated-v2 (sans filtre, OpenAI-compatible) ---
          # L'id du modèle servi = le modelURL vLLM (voir apps/vllm/values.yaml).
          - name: "vLLM Qwen3-14B (sans filtre)"
            apiKey: "EMPTY"
            baseURL: "http://vllm-router-service.vllm.svc.cluster.local/v1"
            models:
              default: ["warshanks/Huihui-Qwen3-14B-abliterated-v2-AWQ"]
              fetch: true
            titleConvo: true
            titleModel: "warshanks/Huihui-Qwen3-14B-abliterated-v2-AWQ"
            modelDisplayLabel: "Qwen3-14B (sans filtre)"

          # --- API RAG MireCloud (cloisonné par utilisateur) ---
          - name: "RAG MireCloud"
            apiKey: "dummy"
            baseURL: "http://rag-api.rag.svc.cluster.local:8000/v1"
            models:
              default: ["rag"]        # ⚠️ ajuster au nom réel exposé par /v1/models
              fetch: true
            titleConvo: false
            modelDisplayLabel: "RAG"
            # Forwarde l'identité vers l'API RAG. L'endpoint /v1/chat/completions
            # lit UNIQUEMENT `X-OpenWebUI-User-Email` (puis résout les groupes via
            # le service account Keycloak — chemin #3, identique à Open WebUI).
            # Les anciens noms X-User-Email/X-User-Id étaient ignorés → email=None
            # → `IDENTITY jwt=yes x_groups=None email=None` → 401.
            headers:
              X-OpenWebUI-User-Email: "{{LIBRECHAT_USER_EMAIL}}"

    existingConfigYaml: ""

    # Volume pour les images uploadées dans le Web UI
    imageVolume:
      enabled: true
      size: 10G
      accessModes: ReadWriteOnce
      storageClassName: "nfs-client"

  # RAG lite bundlé : désactivé, on utilise l'API RAG externe (rag namespace)
  librechat-rag-api:
    enabled: false

  # On expose via Gateway API (templates/gateway.yaml), pas via Ingress
  ingress:
    enabled: false

  # --- CA interne montée dans le conteneur (pour NODE_EXTRA_CA_CERTS) ---
  volumes:
    - name: ca-certs
      secret:
        secretName: mirecloud-ca-cert
  volumeMounts:
    - name: ca-certs
      mountPath: /etc/ssl/certs/vault-ca.crt
      subPath: ca.crt
      readOnly: true

  # --- MongoDB (bundlé) ---
  mongodb:
    enabled: true
    image:
      repository: bitnamilegacy/mongodb
      # Image MODERNE requise : le chart monte un emptyDir vide sur
      # /opt/bitnami/mongodb/conf et compte sur l'image pour (re)créer
      # mongodb.conf au runtime. Les vieilles images (ex. 4.4.15) avaient le
      # conf "cuit" à la construction → masqué par l'emptyDir → conf absent →
      # `sed: can't read .../mongodb.conf`. 8.0 le recrée au démarrage.
      # (node-1 expose AVX en host-passthrough, donc MongoDB 5.0+ OK.)
      tag: "8.0.13-debian-12-r0"
      # ⚠️ Le sous-chart Bitnami épingle un `digest`, et son helper d'image
      #    (common.images.image) l'utilise EN PRIORITÉ sur le tag : sans ce
      #    `digest: ""`, le tag ci-dessus serait ignoré.
      digest: ""
    auth:
      enabled: false
    databases:
      - LibreChat
    persistence:
      size: 8Gi
      storageClass: "nfs-client"

  # --- Meilisearch (bundlé) ---
  meilisearch:
    enabled: true
    persistence:
      enabled: true
      storageClass: "nfs-client"
    image:
      tag: "v1.7.3"
      # Même piège que MongoDB : on neutralise le digest hérité pour que le
      # tag v1.7.3 soit réellement appliqué.
      digest: ""
    auth:
      # Réutilise le Secret unique (clé MEILI_MASTER_KEY)
      existingMasterKeySecret: "librechat-credentials-env"

  # --- Redis (non utilisé) ---
  redis:
    enabled: false
    architecture: standalone
    auth:
      enabled: false
