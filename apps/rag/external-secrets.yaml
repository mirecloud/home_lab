apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rag-pgvector
  namespace: rag
spec:
  refreshInterval: 1m
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: rag-pgvector, creationPolicy: Owner }
  data:
    - secretKey: db-url
      remoteRef: { key: secret/rag/pgvector, property: db-url }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mirecloud-ca-sync
  namespace: rag
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: mirecloud-ca-cert, creationPolicy: Owner }
  data:
    - secretKey: ca.crt
      remoteRef: { key: secret/mirecloud/ca, property: tls.crt }