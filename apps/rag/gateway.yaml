apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rag-tls-cert
  namespace: rag
spec:
  secretName: rag-tls-secret
  issuerRef: { name: mirecloud-ca-issuer, kind: ClusterIssuer }
  commonName: rag.mirecloud.com
  dnsNames: [ rag.mirecloud.com ]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mirecloud-gateway
  namespace: rag
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes: { namespaces: { from: Same } }
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs: [ { kind: Secret, name: rag-tls-secret } ]
      allowedRoutes: { namespaces: { from: Same } }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rag-route
  namespace: rag
spec:
  parentRefs: [ { name: mirecloud-gateway } ]
  hostnames: [ "rag.mirecloud.com" ]
  rules:
    - matches: [ { path: { type: PathPrefix, value: / } } ]
      backendRefs: [ { name: rag-api, port: 8000 } ]