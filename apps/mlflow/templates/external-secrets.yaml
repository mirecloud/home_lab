apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-db-es
  namespace: mlflow
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-database-secret
    creationPolicy: Owner
  data:
  - secretKey: passwordKey
    remoteRef:
      #  IDEM ICI, CHEMIN SIMPLE
      key: secret/mlflow/db
      property: password
  - secretKey: usernameKey
    remoteRef:
      key: secret/mlflow/db
      property: user


---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-creds-es
  namespace: mlflow
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mlflow-admin-credentials
    creationPolicy: Owner
  data:
  - secretKey: passwordKey
    remoteRef:
      #  IDEM ICI, CHEMIN SIMPLE
      key: secret/mlflow/creds
      property: password
  - secretKey: usernameKey
    remoteRef:
      key: secret/mlflow/creds
      property: user