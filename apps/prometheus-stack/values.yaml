kube-prometheus-stack:
  grafana:
    enabled: true

    # Injection du secret (comme tu l'as bien fait)
    envFromSecret: grafana-keycloak-secret

    grafana.ini:
      server:
        domain: grafana.mirecloud.com
        root_url: "https://grafana.mirecloud.com"
        serve_from_sub_path: false
      auth:
        disable_login_form: false
        oauth_auto_login: false
      auth.generic_oauth:
        enabled: true
        name: "Keycloak"
        tls_skip_verify_insecure: true
        client_id: "grafana"
        client_secret: $__env{client_secret}
        auth_url: "https://keycloak.mirecloud.com/realms/mirecloud/protocol/openid-connect/auth"
        token_url: "https://keycloak.mirecloud.com/realms/mirecloud/protocol/openid-connect/token"
        api_url: "https://keycloak.mirecloud.com/realms/mirecloud/protocol/openid-connect/userinfo"
        scopes: "openid profile email"
        allow_sign_up: true
        role_attribute_path: "contains(realm_access.roles[*], 'admin') && 'Admin' || 'Viewer'"

    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: "mirecloud-ca-issuer"
        nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
      hosts:
        - grafana.mirecloud.com
      paths:
        - /
      pathType: Prefix
      tls:
        - secretName: grafana-tls-cert
          hosts:
            - grafana.mirecloud.com

  # On désactive Prometheus Ingress pour l'instant pour tester Grafana seul
  prometheus:
    ingress:
      enabled: false
