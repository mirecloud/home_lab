open-webui:
  ollama:
    enabled: false

  sso:
    enabled: true
    enableSignup: true
    mergeAccountsByEmail: true
    enableGroupManagement: true
    oidc:
      enabled: true
      clientId: "openwebui"
      clientExistingSecret: "openwebui-oidc"
      clientExistingSecretKey: "client-secret"
      providerUrl: "https://keycloak.mirecloud.com/auth/realms/mirecloud/.well-known/openid-configuration"
      providerName: "Keycloak"
      scopes: "openid email profile"
    groupManagement:
      groupsClaim: "groups"

  extraEnvVars:
    # DEUX connexions OpenAI : vLLM (chat qwen) + ton API RAG (cloisonné)
    - name: OPENAI_API_BASE_URLS
      value: "http://vllm-router-service.vllm.svc.cluster.local/v1;http://rag-api.rag.svc.cluster.local:8000/v1"
    - name: OPENAI_API_KEYS
      value: "EMPTY;dummy"          # une clé par URL, même ordre
    # SSO / groupes
    - name: WEBUI_AUTH
      value: "true"
    - name: OAUTH_CODE_CHALLENGE_METHOD
      value: "S256"
    - name: ENABLE_OAUTH_GROUP_CREATION
      value: "true"
    # ← NOUVEAU : forwarde l'identité (email/groupes) vers ton API RAG
    - name: ENABLE_FORWARD_USER_INFO_HEADERS
      value: "true"
    # SSL (CA interne pour Keycloak)
    - name: REQUESTS_CA_BUNDLE
      value: "/etc/ssl/certs/vault-ca.crt"
    - name: SSL_CERT_FILE
      value: "/etc/ssl/certs/vault-ca.crt"

  volumes:
    - name: ca-certs
      secret:
        secretName: mirecloud-ca-cert

  volumeMounts:
    container:
      - name: ca-certs
        mountPath: /etc/ssl/certs/vault-ca.crt
        subPath: ca.crt
        readOnly: true

  persistence:
    enabled: true
    size: "8Gi"
    storageClass: "nfs-client"