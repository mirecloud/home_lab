open-webui:
  ollama:
    enabled: false

  # --- Authentification SSO (Keycloak / OIDC) ---
  sso:
    enabled: true
    enableSignup: true
    mergeAccountsByEmail: true
    enableGroupManagement: true
    oidc:
      enabled: true
      clientId: "openwebui"
      clientExistingSecret: "openwebui-oidc"
      clientExistingSecretKey: "client-secret"
      providerUrl: "https://keycloak.mirecloud.com/auth/realms/mirecloud/.well-known/openid-configuration"
      providerName: "Keycloak"
      scopes: "openid email profile"      # ← "groups" retiré (scope invalide côté Keycloak)
    groupManagement:
      groupsClaim: "groups"

  extraEnvVars:
    - name: PGVECTOR_DB_URL
      value: "postgresql://raguser:mirecloud@192.168.2.164:5432/ragdb"
    - name: OPENAI_API_BASE_URL
      value: "http://vllm-router-service.vllm.svc.cluster.local/v1"
    - name: OPENAI_API_KEY
      value: "EMPTY"      # vLLM n'exige pas de clé, mais Open WebUI veut un champ non vide
    - name: RAG_EMBEDDING_ENGINE
      value: "ollama"
    - name: RAG_EMBEDDING_MODEL
      value: "all-minilm"
    - name: WEBUI_AUTH
      value: "true"
    - name: OAUTH_CODE_CHALLENGE_METHOD
      value: "S256"
    - name: REQUESTS_CA_BUNDLE
      value: "/etc/ssl/certs/vault-ca.crt"
    - name: SSL_CERT_FILE
      value: "/etc/ssl/certs/vault-ca.crt"
    - name: ENABLE_OAUTH_GROUP_CREATION
      value: "true"

  volumes:
    - name: ca-certs
      secret:
        secretName: mirecloud-ca-cert

  volumeMounts:
    container:
      - name: ca-certs
        mountPath: /etc/ssl/certs/vault-ca.crt
        subPath: ca.crt
        readOnly: true

  persistence:
    enabled: true
    size: "8Gi"
    storageClass: "nfs-client"