apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-oidc
  namespace: openwebui
  labels:
    app: openwebui 
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openwebui-oidc
    creationPolicy: Owner
  data:
  - secretKey: client-secret
    remoteRef:
      #  IDEM ICI, CHEMIN SIMPLE
      key: secret/openweui/secret
      property: client-secret
   