# -- Configuration Ollama
ollama:
  enabled: false

# -- Configuration OIDC (Native)
oidc:
  enabled: true
  clientId: "openwebui"
  clientExistingSecret: "openwebui-oidc"
  clientExistingSecretKey: "client-secret"
  providerUrl: "https://keycloak.mirecloud.com/auth/realms/mirecloud/.well-known/openid-configuration"
  providerName: "Keycloak"
  scopes: "openid email profile groups"

# -- Configuration Système & SSL
extraEnvVars:
  - name: OLLAMA_BASE_URL
    value: "http://ollama.ollama.svc.cluster.local:11434"
  - name: WEBUI_AUTH
    value: "true"
  - name: ENABLE_OAUTH_SIGNUP
    value: "true"
  - name: REQUESTS_CA_BUNDLE
    value: "/etc/ssl/certs/mirecloud-ca.crt"
  - name: SSL_CERT_FILE
    value: "/etc/ssl/certs/mirecloud-ca.crt"

# -- Montage des certificats
extraVolumes:
  - name: ca-certs
    secret:
      secretName: mirecloud-ca-cert

extraVolumeMounts:
  - name: ca-certs
    mountPath: /etc/ssl/certs/mirecloud-ca.crt
    subPath: ca.crt
    readOnly: true

# -- Persistance
persistence:
  enabled: true
  size: "8Gi"
  storageClass: "nfs-client"