# =====================================================================
# vllm-stack values.yaml — MireCloud / nœud AI (RTX 5060 16 Go, Blackwell sm_120)
# Modèle principal : Qwen3-14B abliterated-v2 (int4, SANS FILTRE)
#   repo : warshanks/Huihui-Qwen3-14B-abliterated-v2-AWQ
#   ⚠️ malgré le "-AWQ" du nom, la quant est compressed-tensors int4 (pas AWQ classique)
# =====================================================================
vllm-stack:

  servingEngineSpec:
    enableEngine: true

    # La liste modelSpec accepte PLUSIEURS entrées = plusieurs modèles.
    # ⚠️ Chaque entrée avec requestGPU:1 occupe 1 GPU entier. Avec UN seul
    #    GPU, un seul modèle peut être chargé à la fois (le 2e reste Pending).
    #    Voir la note "Plusieurs modèles" en bas pour les options.
    modelSpec:

      # ─────────────────────────────────────────────────────────────
      # MODÈLE 1 — Qwen3-14B abliterated-v2 (int4, sans filtre)
      # ─────────────────────────────────────────────────────────────
      - name: "qwen25-14b"                              # nom K8s LEGACY conservé exprès → réutilise le PVC/JIT existant (PAS de point : interdit en K8s). L'id réel du modèle = modelURL ci-dessous.
        repository: "vllm/vllm-openai"
        tag: "v0.11.0"                                  # moteur V1, supporte Qwen3 + compressed-tensors
        modelURL: "warshanks/Huihui-Qwen3-14B-abliterated-v2-AWQ"  # Qwen3-14B abliterated, int4 g128 (~9 Go VRAM)
        replicaCount: 1

        requestCPU: 2
        requestMemory: "12Gi"                           # marge RAM hôte au chargement
        limitMemory: "20Gi"
        requestGPU: 1
        limitGPU: 1

        # ── Limite la compilation JIT des kernels CUDA (Blackwell sm_120) ──
        # GPU trop récent pour les kernels précompilés de vLLM 0.11.0 →
        # compilation runtime. Sans limite : ~6×cicc×1,3 Go ≈ 18 Go → OOMKilled.
        env:
          - name: MAX_JOBS
            value: "2"                                  # max 2 compils parallèles (~2,6 Go)
          - name: NVCC_THREADS
            value: "1"
          - name: TORCH_CUDA_ARCH_LIST
            value: "12.0"                               # compile UNIQUEMENT pour sm_120
          - name: VLLM_CACHE_ROOT
            value: "/data/vllm_cache"                   # cache JIT sur PVC → compilé une fois
          - name: TORCH_EXTENSIONS_DIR
            value: "/data/torch_ext"

        # ── Cache modèle + JIT sur PVC (pas sur l'ephemeral-storage du nœud) ──
        pvcStorage: "30Gi"
        pvcAccessMode:
          - ReadWriteOnce

        vllmConfig:
          maxModelLen: 8192                             # modèle supporte 40k ; garde 8192 pour le KV en 16 Go (si besoin → 16384)
          dtype: "half"                                 # calcul en float16
          enablePrefixCaching: true
          extraArgs:
            - "--enforce-eager"                         # pas de torch.compile/cudagraph → évite l'OOM RAM hôte
            - "--quantization"
            - "compressed-tensors"                      # ⚠️ Qwen3 = compressed-tensors int4 (PAS awq_marlin). Kernel Marlin w4a16 compilé pour sm_120.
            - "--gpu-memory-utilization"
            - "0.90"                                    # si OOM profiling → 0.85
            # ── OPTION (raisonnement Qwen3) ──
            # Qwen3 émet des blocs <think>…</think> par défaut (mode thinking).
            # Pour des réponses propres (chat/RAG), décommente pour router le
            # raisonnement dans un champ séparé que LibreChat ignore :
            # - "--reasoning-parser"
            # - "qwen3"
          # ⚠️ PAS de --chat-template : Qwen3 embarque le sien dans son tokenizer.

        nodeSelectorTerms:
          - matchExpressions:
              - key: "nvidia.com/gpu.present"
                operator: In
                values: ["true"]

      # ─────────────────────────────────────────────────────────────
      # MODÈLE 2 (OPTIONNEL) — petit modèle co-résident
      # Décommente UNIQUEMENT si tu as activé le GPU time-slicing/MPS
      # (sinon il restera Pending faute de 2e GPU). Voir note en bas.
      # ─────────────────────────────────────────────────────────────
      # - name: "qwen25-3b"
      #   repository: "vllm/vllm-openai"
      #   tag: "v0.11.0"
      #   modelURL: "Qwen/Qwen2.5-3B-Instruct-AWQ"
      #   replicaCount: 1
      #   requestCPU: 2
      #   requestMemory: "8Gi"
      #   limitMemory: "12Gi"
      #   requestGPU: 1
      #   limitGPU: 1
      #   env:
      #     - name: TORCH_CUDA_ARCH_LIST
      #       value: "12.0"
      #     - name: MAX_JOBS
      #       value: "2"
      #     - name: NVCC_THREADS
      #       value: "1"
      #     - name: VLLM_CACHE_ROOT
      #       value: "/data/vllm_cache"
      #     - name: TORCH_EXTENSIONS_DIR
      #       value: "/data/torch_ext"
      #   pvcStorage: "15Gi"
      #   pvcAccessMode:
      #     - ReadWriteOnce
      #   vllmConfig:
      #     maxModelLen: 8192
      #     dtype: "half"
      #     enablePrefixCaching: true
      #     extraArgs:
      #       - "--enforce-eager"
      #       - "--quantization"
      #       - "awq_marlin"
      #       - "--gpu-memory-utilization"
      #       - "0.20"
      #   nodeSelectorTerms:
      #     - matchExpressions:
      #         - key: "nvidia.com/gpu.present"
      #           operator: In
      #           values: ["true"]

  # ─────────────────────────────────────────────
  # ROUTER (inchangé)
  # ─────────────────────────────────────────────
  routerSpec:
    enableRouter: true
    replicaCount: 1
    repository: "lmcache/lmstack-router"
    tag: "v0.1.11"
    routingLogic: "roundrobin"

    startupProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 60
      periodSeconds: 10
      failureThreshold: 30

    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 10
      periodSeconds: 5

    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
    serviceType: ClusterIP