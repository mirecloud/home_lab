vllm-stack:
  # ─────────────────────────────────────────────
  # ENGINE
  # ─────────────────────────────────────────────
  servingEngineSpec:
    enableEngine: true
    modelSpec:
      - name: "mistral"
        repository: "vllm/vllm-openai"
        tag: "v0.11.0"                                  # compatible chart vllm-stack 0.1.11 (moteur V1). Évite "latest" en GitOps.
        modelURL: "RedHatAI/Mistral-7B-Instruct-v0.3-FP8"
        replicaCount: 1

        requestCPU: 2
        requestMemory: "12Gi"                           # ↑ marge pour le pic RAM hôte au chargement
        limitMemory: "20Gi"                             # plafond explicite (évite l'OOM node-level sur pod Burstable)
        requestGPU: 1                                   # FP8 nécessite un GPU
        limitGPU: 1

        # ── Variables d'env : limite la compilation JIT des kernels CUDA ──
        # GPU Blackwell (RTX 5060 Ti, sm_120) trop récent pour les kernels
        # précompilés de vLLM 0.11.0 → compilation runtime. Sans limite,
        # ~6 process "cicc" × 1,3 Go = ~18 Go → OOMKilled au profiling.
        env:
          - name: MAX_JOBS
            value: "2"                                  # max 2 compilations parallèles (~2,6 Go au lieu de ~18 Go)
          - name: NVCC_THREADS
            value: "1"
          - name: TORCH_CUDA_ARCH_LIST
            value: "12.0"                               # compile UNIQUEMENT pour sm_120 (ton GPU), pas toutes les archis
          - name: VLLM_CACHE_ROOT
            value: "/data/vllm_cache"                   # cache JIT sur le PVC → compilé une seule fois, persiste aux restarts
          - name: TORCH_EXTENSIONS_DIR
            value: "/data/torch_ext"                    # idem pour les extensions torch compilées

        # ── Cache du modèle sur PVC (PAS sur le disque local du nœud) ──
        # Sans ça, les poids (~8 Gi) + cache HF + cache torch.compile vont en
        # ephemeral-storage de node-gpu → saturation disque → éviction du pod.
        pvcStorage: "30Gi"
        pvcAccessMode:
          - ReadWriteOnce

        vllmConfig:
          maxModelLen: 8192
          dtype: "auto"
          enablePrefixCaching: true                     # champ natif du chart → émet "--enable-prefix-caching" (et PAS "--no-...")
          extraArgs:
            - "--enforce-eager"                         # désactive torch.compile/cudagraph → supprime le pic RAM hôte qui OOM-kill au démarrage
            - "--chat-template"
            - "/templates/mistral-v0.3.jinja"
            - "--gpu-memory-utilization"
            - "0.85"

        extraVolumes:
          - name: chat-template
            configMap:
              name: mistral-chat-template
        extraVolumeMounts:
          - name: chat-template
            mountPath: /templates
            readOnly: true

        nodeSelectorTerms:
          - matchExpressions:
              - key: "nvidia.com/gpu.present"
                operator: In
                values: ["true"]

  # ─────────────────────────────────────────────
  # ROUTER
  # ─────────────────────────────────────────────
  routerSpec:
    enableRouter: true
    replicaCount: 1
    repository: "lmcache/lmstack-router"
    tag: "v0.1.11"
    routingLogic: "roundrobin"

    startupProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 60
      periodSeconds: 10
      failureThreshold: 30

    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 10
      periodSeconds: 5

    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
    serviceType: ClusterIP