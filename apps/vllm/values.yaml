vllm-stack:
  # ─────────────────────────────────────────────
  # ENGINE
  # ─────────────────────────────────────────────
  servingEngineSpec:
    enableEngine: true
    modelSpec:
      - name: "mistral"
        repository: "vllm/vllm-openai"
        tag: "v0.6.3" 
        modelURL: "RedHatAI/Mistral-7B-Instruct-v0.3-FP8"
        replicaCount: 1

        requestCPU: 6
        requestMemory: "16Gi"
        requestGPU: 1
        limitGPU: 1

        vllmConfig:
          maxModelLen: 8192
          dtype: "auto"
          # Assure-toi que le template ne rajoute pas des arguments "hardcodés"
          extraArgs:
            - "--chat-template"
            - "/templates/mistral-v0.3.jinja"
            - "--gpu-memory-utilization"
            - "0.85"

        extraVolumes:
          - name: chat-template
            configMap:
              name: mistral-chat-template
        extraVolumeMounts:
          - name: chat-template
            mountPath: /templates
            readOnly: true

        nodeSelectorTerms:
          - matchExpressions:
              - key: "nvidia.com/gpu.present"
                operator: In
                values: ["true"]

  # ─────────────────────────────────────────────
  # ROUTER
  # ─────────────────────────────────────────────
  routerSpec:
    enableRouter: true
    replicaCount: 1
    repository: "lmcache/lmstack-router"
    tag: "v0.1.11" # Version stable
    routingLogic: "roundrobin"
    
    startupProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 5
      failureThreshold: 12
      
    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 10
      periodSeconds: 5

    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
    serviceType: ClusterIP