# values.yaml - vLLM MireCloud
# Corrigé :
#   - schéma pvcStorage : string + champs frères (pvcAccessMode, storageClass)
#   - modèle FP8 pour tenir dans 16GB VRAM (RTX 5060 Ti / Blackwell)

servingEngineSpec:
  enableEngine: true
  runtimeClassName: nvidia

  nodeSelector:
    kubernetes.io/hostname: node-gpu

  tolerations:
    - key: gpu
      operator: Equal
      value: value          # ⚠️ vérifie le taint réel : kubectl describe node node-gpu | grep -i taint
      effect: NoSchedule

  labels:
    environment: test
    release: test

  modelSpec:
    - name: mistral
      repository: vllm/vllm-openai
      tag: latest
      # FP8 : ~7.5GB de poids (vs ~14.5GB en fp16). Tient large dans 16GB,
      # qualité quasi-fp16, accéléré nativement par Blackwell.
      modelURL: RedHatAI/Mistral-7B-Instruct-v0.3-FP8

      replicaCount: 1
      requestGPU: 1

      # --- Stockage : champs FRÈRES, PAS un objet imbriqué ---
      pvcStorage: "50Gi"
      pvcAccessMode:
        - ReadWriteOnce
      storageClass: "nfs-client"
      # -------------------------------------------------------

      resources:
        requests:
          cpu: "4"
          memory: 8Gi
          ephemeral-storage: 20Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 16Gi
          ephemeral-storage: 40Gi
          nvidia.com/gpu: "1"

      vllmConfig:
        maxModelLen: 4096
        gpuMemoryUtilization: 0.90
        dtype: auto           # FP8 auto-détecté depuis le config du modèle

routerSpec:
  enableRouter: true
  routingLogic: roundrobin
  nodeSelector:
    kubernetes.io/hostname: node-gpu
  tolerations:
    - key: gpu
      operator: Equal
      value: value
      effect: NoSchedule
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 10Gi
    limits:
      cpu: "2"
      memory: 4Gi
      ephemeral-storage: 20Gi

  serviceDiscovery: k8s
  k8sNamespace: vllm
  k8sServiceDiscoveryType: pod-ip
  k8sLabelSelector: environment=test,release=test