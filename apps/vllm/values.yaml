vllm-stack:
  # ─────────────────────────────────────────────
  # ENGINE
  # ─────────────────────────────────────────────
  servingEngineSpec:
    enableEngine: true
    modelSpec:
      - name: "mistral"
        repository: "vllm/vllm-openai"
        tag: "v0.11.0"                                  # compatible chart vllm-stack 0.1.11 (moteur V1). Évite "latest" en GitOps.
        modelURL: "RedHatAI/Mistral-7B-Instruct-v0.3-FP8"
        replicaCount: 1

        requestCPU: 2
        requestMemory: "8Gi"
        requestGPU: 1                                   # FP8 nécessite un GPU
        limitGPU: 1

        # ── Cache du modèle sur PVC (PAS sur le disque local du nœud) ──
        # Sans ça, les poids (~8 Gi) + cache HF + cache torch.compile vont en
        # ephemeral-storage de node-gpu → saturation disque → éviction du pod.
        pvcStorage: "30Gi"
        pvcAccessMode:
          - ReadWriteOnce

        vllmConfig:
          maxModelLen: 8192
          dtype: "auto"
          enablePrefixCaching: true                     # champ natif du chart → émet "--enable-prefix-caching" (et PAS "--no-...")
          extraArgs:
            - "--chat-template"
            - "/templates/mistral-v0.3.jinja"
            - "--gpu-memory-utilization"
            - "0.85"

        extraVolumes:
          - name: chat-template
            configMap:
              name: mistral-chat-template
        extraVolumeMounts:
          - name: chat-template
            mountPath: /templates
            readOnly: true

        nodeSelectorTerms:
          - matchExpressions:
              - key: "nvidia.com/gpu.present"
                operator: In
                values: ["true"]

  # ─────────────────────────────────────────────
  # ROUTER
  # ─────────────────────────────────────────────
  routerSpec:
    enableRouter: true
    replicaCount: 1
    repository: "lmcache/lmstack-router"
    tag: "v0.1.11"
    routingLogic: "roundrobin"

    startupProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 5
      failureThreshold: 12

    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 10
      periodSeconds: 5

    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
    serviceType: ClusterIP