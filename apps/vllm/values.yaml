# 1. Configuration du Moteur de Serving (VLLM)
# Il tournera exclusivement sur ton nœud GPU
servingEngineSpec:
  enableEngine: true
  runtimeClassName: "nvidia"
  nodeSelector:
    kubernetes.io/hostname: "node-gpu"
  modelSpec:
    - name: "mistral-7b-instruct"
      repository: "vllm/vllm-openai"
      tag: "latest"
      modelURL: "mistralai/Mistral-7B-Instruct-v0.3"
      replicaCount: 1
      requestGPU: 1
      limitMemory: "16Gi"
      vllmConfig:
        maxModelLen: 8192
        gpuMemoryUtilization: 0.85
        dtype: "bfloat16"

# 2. Configuration du Routeur
# Il peut rester sur un nœud standard, mais on force le placement
routerSpec:
  enableRouter: true
  routingLogic: "roundrobin"
  nodeSelector:
    kubernetes.io/hostname: "node-gpu" # Force le routeur sur le même nœud si c'est ton souhait
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"