# values.yaml — vllm-wrapper (umbrella chart)
# Tout est nesté sous la dépendance vllm-stack
vllm-stack:

  # ─────────────────────────────────────────────
  # ENGINE — le pod qui charge et sert le modèle
  # ─────────────────────────────────────────────
  servingEngineSpec:
    enableEngine: true

    modelSpec:
      - name: "mistral"                                   # → vllm-mistral-deployment-vllm
        repository: "vllm/vllm-openai"
        tag: "latest"                                     # ⚠️ À FIXER : épingle ta version exacte (ex: v0.10.x) — "latest" est dangereux en GitOps
        modelURL: "RedHatAI/Mistral-7B-Instruct-v0.3-FP8"

        replicaCount: 1

        # ── Ressources ── ⚠️ À RÉCONCILIER avec ton sizing réel (VM 8 cores / 24Gi)
        requestCPU: 6
        requestMemory: "16Gi"
        requestGPU: 1
        limitGPU: 1

        # ── Stockage du modèle (cache HF) ──
        pvcStorage: "30Gi"                                # ⚠️ FP8 7B ≈ 8-9Gi, 30Gi laisse de la marge
        pvcAccessMode:
          - ReadWriteOnce

        # ── Config vLLM ──
        vllmConfig:
          maxModelLen: 8192                               # ⚠️ Ajuste selon ta VRAM dispo (16Gi)
          dtype: "auto"                                   # FP8 géré par le modèle quantifié lui-même
          extraArgs:
            - "--chat-template"
            - "/templates/mistral-v0.3.jinja"
            - "--gpu-memory-utilization"
            - "0.90"

        # ── LE FIX : montage du chat template ──
        extraVolumes:
          - name: chat-template
            configMap:
              name: mistral-chat-template
        extraVolumeMounts:
          - name: chat-template
            mountPath: /templates
            readOnly: true

        # ── Token HuggingFace ── ⚠️ À FIXER selon ta gestion de secrets
        # Si le modèle RedHatAI est public tu peux retirer ce bloc.
        # Sinon, référence ton secret (probablement via Vault/ESO chez toi)
        hf_token:
          secretName: "hf-token-secret"
          secretKey: "token"

        # ── Placement sur le node GPU ── ⚠️ À FIXER : ton label réel de node GPU
        nodeSelectorTerms:
          - matchExpressions:
              - key: "nvidia.com/gpu.present"
                operator: In
                values:
                  - "true"

        # Variables d'env utiles pour Blackwell / debugging
        env:
          - name: VLLM_LOGGING_LEVEL
            value: "INFO"

  # ─────────────────────────────────────────────
  # ROUTER — point d'entrée OpenAI-compatible
  # (c'est lui que Open WebUI cible : vllm-router-service:80/v1)
  # ─────────────────────────────────────────────
  routerSpec:
    enableRouter: true
    replicaCount: 1
    repository: "lmcache/lmstack-router"
    tag: "latest"                                         # ⚠️ Épingle aussi
    routingLogic: "roundrobin"
    resources:
      requests:
        cpu: "1"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "1Gi"
    serviceType: ClusterIP