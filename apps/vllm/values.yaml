# values.yaml - vLLM MireCloud
# Version complète corrigée. Récap des fixes appliqués :
#   1. pvcStorage : schéma à plat (string) + champs frères pvcAccessMode / storageClass
#   2. modelURL  : modèle FP8 pour tenir dans 16GB VRAM (RTX 5060 Ti / Blackwell)
#   3. enabled: true sur le modelSpec  -> sinon le chart ne rend PAS le Deployment engine
#   4. startupProbe du router desserrée -> cold start ~38s (imports torch/lmcache) qui
#      se faisait tuer (SIGKILL/137) par une probe trop agressive

servingEngineSpec:
  enableEngine: true
  runtimeClassName: nvidia

  nodeSelector:
    kubernetes.io/hostname: node-gpu

  # ATTENTION au taint reel du node :
  #   kubectl describe node node-gpu | grep -i taint
  # - si taint type "gpu=true:NoSchedule" -> mettre value: "true"
  # - si AUCUN taint sur node-gpu        -> supprimer tout ce bloc tolerations
  tolerations:
    - key: gpu
      operator: Equal
      value: value
      effect: NoSchedule

  labels:
    environment: test
    release: test

  modelSpec:
    - name: mistral
      enabled: true          # OBLIGATOIRE : sans ca, aucun Deployment engine n'est cree
      repository: vllm/vllm-openai
      tag: latest
      # FP8 : ~7.5GB de poids (vs ~14.5GB en fp16). Tient large dans 16GB,
      # qualite quasi-fp16, accelere nativement par Blackwell. Auto-detecte par vLLM.
      modelURL: RedHatAI/Mistral-7B-Instruct-v0.3-FP8

      replicaCount: 1
      requestGPU: 1

      # --- Stockage : champs FRERES, PAS un objet imbrique ---
      pvcStorage: "50Gi"
      pvcAccessMode:
        - ReadWriteOnce
      storageClass: "nfs-client"
      # -------------------------------------------------------

      resources:
        requests:
          cpu: "4"
          memory: 8Gi
          ephemeral-storage: 20Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 16Gi
          ephemeral-storage: 40Gi
          nvidia.com/gpu: "1"

      vllmConfig:
        maxModelLen: 4096
        gpuMemoryUtilization: 0.90
        dtype: auto           # FP8 auto-detecte depuis le config du modele

routerSpec:
  enableRouter: true
  routingLogic: roundrobin

  nodeSelector:
    kubernetes.io/hostname: node-gpu

  tolerations:
    - key: gpu
      operator: Equal
      value: value
      effect: NoSchedule

  resources:
    requests:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 10Gi
    limits:
      cpu: "2"
      memory: 4Gi
      ephemeral-storage: 20Gi

  # Cold start du router ~38s (imports torch/lmcache).
  # La probe par defaut (5s + 3x5s ~= 20s) le tuait avant qu'il bind :8000.
  # 300s de budget = large.
  startupProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30

  serviceDiscovery: k8s
  k8sNamespace: vllm
  k8sServiceDiscoveryType: pod-ip
  k8sLabelSelector: environment=test,release=test