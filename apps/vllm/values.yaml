# values.yaml - vLLM MireCloud (chart parapluie vllm-wrapper)
#
# IMPORTANT : Chart.yaml declare vllm-stack comme DEPENDANCE.
# En Helm, les values d'une dependance doivent etre IMBRIQUEES sous le nom
# de la dependance. D'ou la cle racine "vllm-stack:" ci-dessous.
# Sans cette imbrication, le subchart ignore tout et tourne sur ses defaults
# (modelSpec exemple enabled:false + storageClass:"" -> PVC FailedBinding,
#  aucun Deployment engine).
#
# Fixes inclus :
#   1. Imbrication sous vllm-stack:  <- LA correction racine
#   2. pvcStorage a plat (string) + pvcAccessMode + storageClass nfs-client
#   3. modelURL FP8 (tient dans 16GB VRAM Blackwell)
#   4. enabled: true sur le modelSpec
#   5. startupProbe router desserree

vllm-stack:

  servingEngineSpec:
    enableEngine: true
    runtimeClassName: nvidia

    nodeSelector:
      kubernetes.io/hostname: node-gpu

    # ATTENTION au taint reel : kubectl describe node node-gpu | grep -i taint
    # - taint type "gpu=true:NoSchedule" -> value: "true"
    # - aucun taint                      -> supprimer ce bloc tolerations
    tolerations:
      - key: gpu
        operator: Equal
        value: value
        effect: NoSchedule

    labels:
      environment: test
      release: test

    modelSpec:
      - name: mistral
        enabled: true          # OBLIGATOIRE : sinon aucun Deployment engine
        repository: vllm/vllm-openai
        tag: latest
        # FP8 : ~7.5GB de poids, tient large dans 16GB, accelere par Blackwell
        modelURL: RedHatAI/Mistral-7B-Instruct-v0.3-FP8

        replicaCount: 1
        requestGPU: 1

        # Stockage : champs FRERES, PAS un objet imbrique
        pvcStorage: "50Gi"
        pvcAccessMode:
          - ReadWriteOnce
        storageClass: "nfs-client"

        resources:
          requests:
            cpu: "4"
            memory: 8Gi
            ephemeral-storage: 20Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: 16Gi
            ephemeral-storage: 40Gi
            nvidia.com/gpu: "1"

        vllmConfig:
          maxModelLen: 4096
          gpuMemoryUtilization: 0.90
          dtype: auto           # FP8 auto-detecte

  routerSpec:
    enableRouter: true
    routingLogic: roundrobin

    nodeSelector:
      kubernetes.io/hostname: node-gpu

    tolerations:
      - key: gpu
        operator: Equal
        value: value
        effect: NoSchedule

    resources:
      requests:
        cpu: "1"
        memory: 2Gi
        ephemeral-storage: 10Gi
      limits:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 20Gi

    # Marge pour le cold start du router (imports torch/lmcache)
    startupProbe:
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 30

    serviceDiscovery: k8s
    k8sNamespace: vllm
    k8sServiceDiscoveryType: pod-ip
    k8sLabelSelector: environment=test,release=test