# values.yaml - vLLM MireCloud

servingEngineSpec:
  enableEngine: true
  runtimeClassName: nvidia

  nodeSelector:
    kubernetes.io/hostname: node-gpu

  tolerations:
    - key: gpu
      operator: Equal
      value: value
      effect: NoSchedule

  labels:
    environment: test
    release: test

  modelSpec:
    - name: mistral
      repository: vllm/vllm-openai
      tag: latest
      modelURL: mistralai/Mistral-7B-Instruct-v0.3

      replicaCount: 1
      requestGPU: 1

      pvcStorage:
        enabled: true
        size: 50Gi
        accessMode: ReadWriteOnce
        storageClassName: nfs-client

      resources:
        requests:
          cpu: "4"
          memory: 8Gi
          ephemeral-storage: 20Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 16Gi
          ephemeral-storage: 40Gi
          nvidia.com/gpu: "1"

      vllmConfig:
        maxModelLen: 4096
        gpuMemoryUtilization: 0.80
        dtype: float16
        trustRemoteCode: true

routerSpec:
  enableRouter: true
  routingLogic: roundrobin

  nodeSelector:
    kubernetes.io/hostname: node-gpu

  tolerations:
    - key: gpu
      operator: Equal
      value: value
      effect: NoSchedule

  resources:
    requests:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 10Gi
    limits:
      cpu: "2"
      memory: 4Gi
      ephemeral-storage: 20Gi

  serviceDiscovery: k8s
  k8sNamespace: vllm
  k8sServiceDiscoveryType: pod-ip
  k8sLabelSelector: environment=test,release=test

pvcStorage:
  enabled: true
  size: 50Gi
  accessMode: ReadWriteOnce
  storageClassName: nfs-client