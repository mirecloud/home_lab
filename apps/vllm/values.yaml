# Configuration MireCloud - Production ready
servingEngineSpec:
  enableEngine: true
  runtimeClassName: "nvidia"
  # Assure le placement sur ton nœud GPU
  nodeSelector:
    kubernetes.io/hostname: "node-gpu"
  # Labels requis pour que le routeur identifie ce backend
  labels:
    environment: "test"
    release: "test"
  modelSpec:
    - name: "mistral-7b-instruct"
      repository: "vllm/vllm-openai"
      tag: "latest"
      modelURL: "mistralai/Mistral-7B-Instruct-v0.3"
      replicaCount: 1
      requestGPU: 1
      # Allocation mémoire et stockage pour éviter les évictions
      limitMemory: "16Gi"
      resources:
        requests:
          memory: "8Gi"
          ephemeral-storage: "10Gi"
        limits:
          memory: "16Gi"
          ephemeral-storage: "20Gi"
      vllmConfig:
        maxModelLen: 8192
        gpuMemoryUtilization: 0.85
        dtype: "bfloat16"

routerSpec:
  enableRouter: true
  routingLogic: "roundrobin"
  nodeSelector:
    kubernetes.io/hostname: "node-gpu"
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
      ephemeral-storage: "10Gi" # Crucial car l'image est très lourde
    limits:
      cpu: "2"
      memory: "4Gi"
      ephemeral-storage: "15Gi"