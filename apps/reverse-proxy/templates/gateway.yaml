apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pve-tls-cert
  namespace: nginx
spec:
  secretName: pve-tls-secret
  issuerRef:
    name: mirecloud-ca-issuer
    kind: ClusterIssuer
  commonName: pve.mirecloud.com
  dnsNames:
    - pve.mirecloud.com

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pve-gateway
  namespace: nginx
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: pve-tls-secret
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pve-route
  namespace: nginx
spec:
  parentRefs:
    - name: pve-gateway
      sectionName: https
  hostnames:
    - pve.mirecloud.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx
          port: 80