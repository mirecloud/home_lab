apiVersion: apps/v1
kind: Deployment
metadata:
  name: crime-api
  namespace: ml510
  labels: {app: crime-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: crime-api}
  template:
    metadata:
      labels: {app: crime-api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: docker.io/mirecloud/crime-api:1.1.0
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: crime-llm}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: crime-api
  namespace: ml510
spec:
  type: ClusterIP
  selector: {app: crime-api}
  ports: [{name: http, port: 80, targetPort: http}]
