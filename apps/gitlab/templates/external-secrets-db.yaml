apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-db-es
  namespace: gitlab
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-postgresql-password # <--- Le nom exact que le pod réclame
  data:
  - secretKey: postgres-password
    remoteRef:
      key: secret/gitlab/db
      property: password