global:
  ingress:
    apiVersion: ""
    configureCertmanager: false
    useNewIngressForCerts: false
    provider: nginx
    # class:
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: "mirecloud-ca-issuer"
    enabled: true
    tls:
      - secretName: gitlab-tls-auto
        hosts:
          - gitlab.mirecloud.com
    #   enabled: true
    #   secretName:
    path: /
    pathType: Prefix

  certificates:
    customCAs:
      - secret: secret-custom-ca

