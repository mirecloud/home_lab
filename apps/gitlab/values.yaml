gitlab:
  # --------------------------------------------------------
  # 1. DÉSACTIVATION DES VÉRIFICATIONS
  # --------------------------------------------------------
  upgradeCheck:
    enabled: false

  global:
    common:
      check: false

    edition: ce
    hosts:
      domain: mirecloud.com
      https: true

    # --------------------------------------------------------
    # 2. CERTIFICATS CUSTOM (Pour que le SSO marche !)
    # --------------------------------------------------------
    certificates:
      customCAs:
        - secret: gitlab-custom-ca-secret

    # --------------------------------------------------------
    # 3. CONFIGURATION SSO (KEYCLOAK)
    # --------------------------------------------------------
    appConfig:
      omniauth:
        enabled: true
        autoLinkUser: ["openid_connect"]
        allowSingleSignOn: ["openid_connect"]
        blockAutoCreatedUsers: false
        providers:
          - secret: gitlab-oidc-config
            key: provider

    # --------------------------------------------------------
    # 4. CONFIGURATION RESEAU & SSL
    # --------------------------------------------------------
    ingress:
      configureCertmanager: false
      class: nginx
      annotations:
        cert-manager.io/cluster-issuer: "mirecloud-ca-issuer"
        nginx.ingress.kubernetes.io/proxy-body-size: "512m"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
        nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
      tls:
        enabled: true
        secretName: gitlab-tls

    # --------------------------------------------------------
    # 5. BASE DE DONNÉES EXTERNE
    # --------------------------------------------------------
    psql:
      password:
        useSecret: true
        secret: gitlab-postgresql-password
        key: postgres-password
      host: postgres.postgres.svc
      port: 5432
      # Changement demandé : on utilise le super-admin
      username: postgres
      database: gitlab

    # Minio Interne
    minio:
      enabled: true

    # Redis Interne
    redis:
      host: ""

  # --------------------------------------------------------
  # 6. COMPOSANTS
  # --------------------------------------------------------
  migrations:
    enabled: true

  postgresql:
    install: false

  gitlab-runner:
    install: false # Sera installé sur VM à part
