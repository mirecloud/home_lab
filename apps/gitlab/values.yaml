global:
  edition: ce

  hosts:
    domain: mirecloud.com
    gitlab:
      name: gitlab.mirecloud.com
    registry:
      name: registry.mirecloud.com

  ingress:
    enabled: true
    provider: nginx
    class: nginx
    configureCertmanager: false
    useNewIngressForCerts: false
    path: /
    pathType: Prefix

    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: mirecloud-ca-issuer

    tls:
      secretName: gitlab-tls-auto

  certificates:
    customCAs:
      - secret: secret-custom-ca

  psql:
    host: postgres.postgres.svc.cluster.local
    port: 5432
    database: gitlab
    username: postgres
    password:
      secret: gitlab-postgres-password
      key: password

gitlab:
  webservice:
    ingress:
      tls:
        enabled: true

  kas:
    enabled: false

  gitlab-shell:
    enabled: true

  gitaly:
    persistence:
      enabled: true
      size: 10Gi

gitlab-runner:
  install: false

postgresql:
  install: false

redis:
  install: true

minio:
  install: true
