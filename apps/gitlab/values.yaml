gitlab:
  # --------------------------------------------------------
  # 1. DÉSACTIVATION DES VÉRIFICATIONS & MAINTENANCE
  # --------------------------------------------------------
  upgradeCheck:
    enabled: false

  # Hack pour valider le template Helm (même si on utilise CertManager externe)
  certmanager-issuer:
    email: admin@mirecloud.com

  # --------------------------------------------------------
  # 2. CONFIGURATION GLOBALE (DONT LE FIX METRICS)
  # --------------------------------------------------------
  global:
    common:
      check: false
    edition: ce
    hosts:
      domain: mirecloud.com
      https: true

    # 🔥 LE FIX FINAL POUR LE MONITORING 🔥
    # Active la génération des configurations métriques partout
    metrics:
      enabled: true

    # Certificats pour le SSO
    certificates:
      customCAs:
        - secret: gitlab-custom-ca-secret

    # Base de données Externe (CNPG)
    psql:
      password:
        useSecret: true
        secret: gitlab-postgresql-password
        key: postgres-password
      host: postgres.postgres.svc
      port: 5432
      username: postgres
      database: gitlab

    # Minio Interne
    minio:
      enabled: true

    # Redis Interne
    redis:
      host: ""

  # --------------------------------------------------------
  # 3. CONFIGURATION SSO (KEYCLOAK)
  # --------------------------------------------------------
  appConfig:
    omniauth:
      enabled: true
      autoLinkUser: ["openid_connect"]
      allowSingleSignOn: ["openid_connect"]
      blockAutoCreatedUsers: false
      providers:
        - secret: gitlab-oidc-config
          key: provider

  # --------------------------------------------------------
  # 4. CONFIGURATION RESEAU (INGRESS)
  # --------------------------------------------------------
  ingress:
    configureCertmanager: false
    class: nginx
    annotations:
      cert-manager.io/cluster-issuer: "mirecloud-ca-issuer"
      nginx.ingress.kubernetes.io/proxy-body-size: "512m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    tls:
      enabled: true
      secretName: gitlab-tls

  # --------------------------------------------------------
  # 5. OBSERVABILITÉ (SERVICE MONITORS)
  # --------------------------------------------------------
  # Note : Grâce au global.metrics.enabled, ces blocs seront enfin lus !

  webservice:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack

  sidekiq:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack

  gitlab-exporter:
    enabled: true
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack

  gitlab-shell:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack

  # --------------------------------------------------------
  # 6. COMPOSANTS DÉSACTIVÉS
  # --------------------------------------------------------

  # On utilise notre propre Prometheus via les ServiceMonitors
  prometheus:
    install: false

  postgresql:
    install: false

  gitlab-runner:
    install: false

  migrations:
    enabled: true
