# Configuration Globale
global:
  edition: ce
  hosts:
    domain: mirecloud.com
    https: true

  # Configuration de l'Ingress
  ingress:
    configureCertmanager: false # On utilise ton propre Cert-Manager
    class: nginx
    annotations:
      cert-manager.io/cluster-issuer: "mirecloud-ca-issuer"
    tls:
      enabled: true
      secretName: gitlab-tls # Cert-Manager créera ce certificat

  # --- CONNEXION POSTGRES EXTERNE ---
  psql:
    password:
      useSecret: true
      secret: gitlab-postgresql-password # Créé par ExternalSecret
      key: postgres-password
    host: postgres.postgres.svc # Le nom DNS de ton service Postgres existant
    port: 5432
    username: postgres
    database: gitlab
  # ----------------------------------

  # Configuration Redis (On garde l'interne pour l'instant pour simplifier)
  redis:
    host: ""
    password: {}

  # Configuration Minio (Stockage objets interne pour l'instant)
  minio:
    enabled: true

# Désactiver le Postgres inclus dans le chart
postgresql:
  install: false

# Configuration Cert-Manager (On désactive celui inclus car tu as le tien)
certmanager:
  install: false

# Configuration du runner (Optionnel, pour faire tourner les pipelines)
gitlab-runner:
  install: true
  rbac:
    create: true
