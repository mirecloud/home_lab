# -----------------------------------------------------------------------
# Wrapper pour GitLab
# -----------------------------------------------------------------------
gitlab:
  # Configuration Globale
  global:
    edition: ce
    hosts:
      domain: mirecloud.com
      https: true

    # Ingress
    ingress:
      # On désactive la configuration automatique de CertManager par GitLab
      configureCertmanager: false
      class: nginx
      annotations:
        cert-manager.io/cluster-issuer: "mirecloud-ca-issuer"
        nginx.ingress.kubernetes.io/proxy-body-size: "512m"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
        nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
      tls:
        enabled: true
        secretName: gitlab-tls

    # Base de données Externe
    psql:
      password:
        useSecret: true
        secret: gitlab-postgresql-password
        key: postgres-password
      host: postgres.postgres.svc
      port: 5432
      username: gitlab
      database: gitlab

    # Minio (Interne)
    minio:
      enabled: true

    # Redis (Interne)
    # On retire "password: {}" qui causait les warnings
    # On retire "host: """ qui était inutile pour le redis interne
    redis:
      host: ""

  # --- DÉSACTIVATIONS ---

  # Désactiver le check de mise à jour (Vital pour passer d'interne à externe)
  upgradeCheck:
    enabled: false

  # Migrations activées
  migrations:
    enabled: true

  # Désactiver le Postgres inclus
  postgresql:
    install: false

  # Désactiver le Cert-Manager inclus
  # Si "install: false" bloque le validateur, on essaie "enabled: false"
  # ou on retire le bloc si global.ingress.configureCertmanager suffit.
  # Tentons la méthode propre standard d'abord :
  certmanager:
    install: false
    # Si ça bloque encore, commente "install: false" et laisse juste le bloc vide
    # ou supprime tout le bloc 'certmanager'.

  # Runner
  gitlab-runner:
    install: true
    rbac:
      create: true
