gitlab:
  # --------------------------------------------------------
  # 1. DÉSACTIVATION DES COMPOSANTS INUTILES
  # --------------------------------------------------------
  upgradeCheck:
    enabled: false

  # On utilise ton NGINX existant
  nginx-ingress:
    enabled: false

  # On utilise ta gestion de certificats (Tu as déjà une PKI)
  certmanager:
    install: false

  # Obligatoire pour satisfaire le template, même si désactivé
  certmanager-issuer:
    email: info@mirecloud.com

  prometheus:
    install: false # On utilise ton kube-prometheus-stack

  gitlab-runner:
    install: false # Tu le gères à part

  postgresql:
    install: false # On utilise ton cluster CNPG

  # --------------------------------------------------------
  # 2. CONFIGURATION GLOBALE (Le cœur du réacteur)
  # --------------------------------------------------------
  global:
    edition: ce

    hosts:
      domain: mirecloud.com
      https: true
      gitlab:
        name: gitlab.mirecloud.com
      registry:
        name: registry.mirecloud.com
      minio:
        name: minio.mirecloud.com
      kas:
        name: kas.mirecloud.com

    # --- INGRESS (Doit impérativement être ici) ---
    ingress:
      configureCertmanager: false
      class: nginx # La clé magique pour utiliser ton contrôleur
      annotations:
        cert-manager.io/cluster-issuer: "mirecloud-ca-issuer"
        # Augmentation des timeouts et tailles pour les git push/pull massifs
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
        nginx.ingress.kubernetes.io/proxy-connect-timeout: "900"
      tls:
        enabled: true
        secretName: gitlab-tls # Ton certificat wildcard ou dédié

    # --- CERTIFICATS INTERNES ---
    certificates:
      customCAs:
        - secret: gitlab-custom-ca-secret

    # --- BASE DE DONNÉES (CNPG) ---
    psql:
      host: postgres.postgres.svc
      port: 5432
      username: postgres # User Admin (Acceptable pour le lab, attention en prod)
      database: gitlab
      password:
        useSecret: true
        secret: gitlab-postgresql-password # Doit être créé via ExternalSecret avant !
        key: postgres-password

    # --- MINIO (Stockage Objet interne) ---
    minio:
      enabled: true

    # --- OMNIAUTH (Keycloak SSO) ---
    appConfig:
      omniauth:
        enabled: true
        autoLinkUser: ["openid_connect"]
        allowSingleSignOn: ["openid_connect"]
        blockAutoCreatedUsers: false
        providers:
          - secret: gitlab-oidc-config # Doit contenir le JSON de config OIDC
            key: provider

  # --------------------------------------------------------
  # 3. OBSERVABILITÉ (Service Monitors pour Prometheus Stack)
  # --------------------------------------------------------
  # Note: Ces blocs sont hors de 'global', c'est correct pour ce chart.

  gitlab-exporter:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus-stack

  webservice:
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus-stack

  sidekiq:
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus-stack

  gitlab-shell:
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus-stack
