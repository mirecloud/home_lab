# ==========================================================
# GitLab CE – homelab mirecloud
# Postgres externe (ns postgres) · MinIO externe (192.168.2.156)
# Ingress Cilium · cert-manager mirecloud-ca-issuer
# ==========================================================

# --- Composants du chart qu'on n'installe PAS ---
installCertmanager: false        # nom de la clé dans les anciennes versions du chart
certmanager:
  install: false                 # nom de la clé dans les versions récentes
certmanager-issuer:
  email: info@mirecloud.com
upgradeCheck:
  enabled: false
nginx-ingress:
  enabled: false
prometheus:
  install: false
gitlab-runner:
  install: false
postgresql:
  install: false

# --- Configuration globale ---
global:
  edition: ce

  hosts:
    domain: mirecloud.com        # gitlab.mirecloud.com, registry.mirecloud.com
    https: true

  kas:
    enabled: false               # inutile, tu fais le GitOps avec ArgoCD

  ingress:
    class: cilium
    configureCertmanager: false
    annotations:
      cert-manager.io/cluster-issuer: mirecloud-ca-issuer
    tls:
      enabled: true

  certificates:
    customCAs:
      - secret: mirecloud-ca     # ta CA, pour que GitLab lui fasse confiance

  psql:
    host: postgres.postgres.svc.cluster.local
    port: 5432
    database: gitlabhq_production
    username: gitlab
    password:
      useSecret: true
      secret: gitlab-postgres
      key: password

  minio:
    enabled: false               # on utilise le MinIO externe

  appConfig:
    object_store:
      enabled: true
      proxy_download: true
      connection:
        secret: gitlab-object-storage
        key: connection
    lfs:             { bucket: gitlab-lfs }
    artifacts:       { bucket: gitlab-artifacts }
    uploads:         { bucket: gitlab-uploads }
    packages:        { bucket: gitlab-packages }
    externalDiffs:   { bucket: gitlab-mr-diffs }
    terraformState:  { bucket: gitlab-terraform-state }
    ciSecureFiles:   { bucket: gitlab-ci-secure-files }
    dependencyProxy: { bucket: gitlab-dependency-proxy }
    backups:
      bucket: gitlab-backups
      tmpBucket: gitlab-tmp
    # SSO Keycloak : on l'activera APRÈS une première installation qui marche

# --- Redis (fourni par le chart, petit) ---
redis:
  master:
    persistence:
      size: 5Gi

# --- Registry -> MinIO ---
registry:
  hpa:
    minReplicas: 1
    maxReplicas: 1
  storage:
    secret: gitlab-registry-storage
    key: config
  ingress:
    tls:
      secretName: registry-tls

# --- Composants GitLab ---
gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
    ingress:
      tls:
        secretName: gitlab-tls
    metrics:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: prometheus-stack

  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    metrics:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: prometheus-stack

  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
    service:
      type: LoadBalancer         # une IP du pool Cilium pour git en SSH

  gitaly:
    persistence:
      size: 20Gi

  gitlab-exporter:
    enabled: false               # économise de la RAM

  toolbox:
    backups:
      objectStorage:
        config:
          secret: gitlab-backup-s3
          key: config