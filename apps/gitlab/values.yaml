# Configuration Globale
global:
  edition: ce
  hosts:
    domain: mirecloud.com
    https: true

  # Configuration de l'Ingress
  ingress:
    configureCertmanager: false
    class: nginx
    annotations:
      cert-manager.io/cluster-issuer: "mirecloud-ca-issuer"
      # Augmenter le timeout pour les gros push Git
      nginx.ingress.kubernetes.io/proxy-body-size: "512m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    tls:
      enabled: true
      secretName: gitlab-tls

  # --- CONNEXION POSTGRES EXTERNE ---
  psql:
    password:
      useSecret: true
      secret: gitlab-postgresql-password
      key: postgres-password
    host: postgres.postgres.svc
    port: 5432
    username: postgres # <--- CORRECTION ICI (C'était 'postgres')
    database: gitlab
  # ----------------------------------

  # Configuration Redis (Interne)
  redis:
    host: ""
    password: {}

  # Configuration Minio (Interne)
  minio:
    enabled: true

# --- FIX POUR L'ERREUR D'UPGRADE ---
# C'est ce bloc qui va dire à Helm "Arrête de vérifier, installe !"
upgradeCheck:
  enabled: false
# -----------------------------------

# Désactiver le Postgres inclus
postgresql:
  install: false

# Désactiver Cert-Manager inclus
certmanager:
  install: false

# Configuration du runner
gitlab-runner:
  install: true
  rbac:
    create: true
