# On désactive le sous-chart au niveau racine
certmanager:
  enabled: false
  installCRDs: false

# CONFIGURATION GLOBALE
global:
  hosts:
    domain: mirecloud.com
    gitlab:
      name: gitlab.mirecloud.com

  ingress:
    enabled: true
    configureCertmanager: false
    provider: nginx
    class: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: mirecloud-ca-issuer
    tls:
      enabled: true
      secretName: gitlab-tls-auto

  # Désactive l'utilisation de cert-manager interne
  certmanager:
    enabled: false

  psql:
    host: postgres.postgres.svc.cluster.local
    port: 5432
    username: postgres
    database: gitlab
    password:
      secret: gitlab-postgres-secret
      key: password

# RESTE DE LA CONFIG
gitlab-runner:
  install: false

postgresql:
  install: false
# On supprime l'ancien bloc psql qui était ici en bas et qui ne servait à rien
