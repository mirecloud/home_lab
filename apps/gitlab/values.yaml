# --- DÉBUT DES MODIFICATIONS ---

# On désactive le sous-chart au niveau racine avec la clé standard
certmanager:
  enabled: false
  installCRDs: false # Ceinture et bretelles

# Configuration globale
global:
  hosts:
    domain: mirecloud.com
    gitlab:
      name: gitlab.mirecloud.com

  ingress:
    enabled: true
    configureCertmanager: false # Dit à GitLab: "Ne configure pas les Certificats, je m'en occupe"
    provider: nginx
    class: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: mirecloud-ca-issuer
    tls:
      enabled: true
      secretName: gitlab-tls-auto

  # On désactive aussi l'intégration interne
  certmanager:
    enabled: false

# --- RESTE DE TA CONFIGURATION ---
gitlab-runner:
  install: false

postgresql:
  install: false

psql:
  host: postgres.postgres.svc.cluster.local
  port: 5432
  username: postgres
  database: gitlab
  password:
    secret: gitlab-postgres-secret
    key: password
