# --- CONFIGURATION DU WRAPPER (Indispensable pour ArgoCD) ---
gitlab:
  # 1. Le Fix pour ton erreur actuelle : On désactive la vérification d'upgrade
  upgradeCheck:
    enabled: false

  # 2. On désactive les migrations (car déjà faites lors de ton install manuelle)
  # Cela évite qu'ArgoCD reste bloqué sur "Running Migrations" à chaque sync
  migrations:
    enabled: false

  # 3. Désactivation des composants internes (Sous la clé 'gitlab' !)
  certmanager:
    enabled: false
    installCRDs: false

  nginx-ingress:
    enabled: false

  prometheus:
    install: false

  gitlab-runner:
    install: false

  postgresql:
    install: false

# --- CONFIGURATION GLOBALE (Reste à la racine) ---
global:
  hosts:
    domain: mirecloud.com
    gitlab:
      name: gitlab.mirecloud.com

  ingress:
    enabled: true
    configureCertmanager: false
    provider: nginx
    class: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: mirecloud-ca-issuer
    tls:
      enabled: true
      secretName: gitlab-tls-auto

  # Désactive l'utilisation logique de cert-manager interne
  certmanager:
    enabled: false

  # Connexion à ta base de données externe
  psql:
    host: postgres.postgres.svc.cluster.local
    port: 5432
    username: postgres
    database: gitlab
    password:
      secret: gitlab-postgres-secret
      key: password
