gitlab:
  # --------------------------------------------------------
  # 1. DÉSACTIVATION DES VÉRIFICATIONS & MAINTENANCE
  # --------------------------------------------------------
  upgradeCheck:
    enabled: false

  global:
    common:
      check: false

    edition: ce
    hosts:
      domain: mirecloud.com
      https: true

    # --------------------------------------------------------
    # 2. CERTIFICATS CUSTOM (Pour que le SSO marche !)
    # --------------------------------------------------------
    certificates:
      customCAs:
        - secret: gitlab-custom-ca-secret

    # --------------------------------------------------------
    # 3. CONFIGURATION SSO (KEYCLOAK)
    # --------------------------------------------------------
    appConfig:
      omniauth:
        enabled: true
        autoLinkUser: ["openid_connect"]
        allowSingleSignOn: ["openid_connect"]
        blockAutoCreatedUsers: false
        providers:
          - secret: gitlab-oidc-config
            key: provider

    # --------------------------------------------------------
    # 4. CONFIGURATION RESEAU & SSL
    # --------------------------------------------------------
    ingress:
      configureCertmanager: false
      class: nginx
      annotations:
        cert-manager.io/cluster-issuer: "mirecloud-ca-issuer"
        nginx.ingress.kubernetes.io/proxy-body-size: "512m"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
        nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
      tls:
        enabled: true
        secretName: gitlab-tls

    # --------------------------------------------------------
    # 5. BASE DE DONNÉES EXTERNE (CNPG)
    # --------------------------------------------------------
    psql:
      password:
        useSecret: true
        secret: gitlab-postgresql-password
        key: postgres-password
      host: postgres.postgres.svc
      port: 5432
      username: postgres
      database: gitlab

    # Minio Interne
    minio:
      enabled: true

    # Redis Interne
    redis:
      host: ""

  # --------------------------------------------------------
  # 6. OBSERVABILITÉ (NOUVEAU !)
  # --------------------------------------------------------

  # On active les ServiceMonitors pour que ton Prometheus externe puisse lire GitLab
  # Important : Le label 'release: kube-prometheus-stack' doit correspondre au nom de ton install prometheus
  webservice:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack

  sidekiq:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack

  gitlab-exporter:
    enabled: true
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack

  # --------------------------------------------------------
  # 7. COMPOSANTS DÉSACTIVÉS (NETTOYAGE)
  # --------------------------------------------------------

  # On désactive le Prometheus inclus dans GitLab (car tu as le tien)
  prometheus:
    install: false

  # On désactive le Postgres inclus (car tu as CNPG)
  postgresql:
    install: false

  # Le runner est géré à part (VM)
  gitlab-runner:
    install: false

  # Migrations activées pour l'initialisation
  migrations:
    enabled: true
