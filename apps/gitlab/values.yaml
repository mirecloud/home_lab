global:
  ingress:
    enabled: true
    provider: nginx
    configureCertmanager: false
    useNewIngressForCerts: false

    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: mirecloud-ca-issuer

    tls:
      secretName: gitlab-tls-auto

    path: /
    pathType: Prefix

  certificates:
    customCAs:
      - secret: secret-custom-ca

gitlab-runner:
  install: false

postgresql:
  install: false

