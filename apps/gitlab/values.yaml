# 1. DÉSACTIVATION DES COMPOSANTS INTERNES
# Traduction de: --set certmanager.enabled=false --set certmanager.installCRDs=false
certmanager:
  enabled: false
  installCRDs: false

# Traduction de: --set nginx-ingress.enabled=false
nginx-ingress:
  enabled: false

# Traduction de: --set prometheus.install=false
prometheus:
  install: false

gitlab-runner:
  install: false

postgresql:
  install: false

# 2. CONFIGURATION GLOBALE
global:
  hosts:
    domain: mirecloud.com
    gitlab:
      name: gitlab.mirecloud.com

  ingress:
    enabled: true
    configureCertmanager: false # Traduction de: --set global.ingress.configureCertmanager=false
    provider: nginx
    class: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: mirecloud-ca-issuer
    tls:
      enabled: true
      secretName: gitlab-tls-auto

  # Désactive l'utilisation logique de cert-manager interne
  certmanager:
    enabled: false

  # Connexion à ta base de données externe
  psql:
    host: postgres.postgres.svc.cluster.local
    port: 5432
    username: postgres
    database: gitlab
    password:
      secret: gitlab-postgres-secret
      key: password
