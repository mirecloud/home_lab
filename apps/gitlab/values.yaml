# ==========================================================
# GitLab CE – homelab mirecloud (chart 10.6.1 / GitLab 19.6.1)
# Postgres externe (ns postgres) · MinIO externe (192.168.2.156)
# Redis externe (ns gitlab) · Ingress Cilium · cert-manager
# ==========================================================

# --- Composants du chart qu'on n'installe PAS ---
installCertmanager: false
certmanager:
  install: false
certmanager-issuer:
  email: info@mirecloud.com
upgradeCheck:
  enabled: false
nginx-ingress:
  enabled: false
prometheus:
  install: false
gitlab-runner:
  install: false
postgresql:
  install: false

# --- Configuration globale ---
global:
  edition: ce

  hosts:
    domain: mirecloud.com          # gitlab.mirecloud.com, registry.mirecloud.com
    https: true

  kas:
    enabled: false                 # inutile avec ArgoCD

  gatewayApi:
    enabled: false                 # pas de Gateway API / Envoy du chart
    installEnvoy: false

  ingress:
    enabled: true                  # Ingress classique, géré par Cilium
    provider: cilium
    class: cilium
    configureCertmanager: false
    annotations:
      cert-manager.io/cluster-issuer: mirecloud-ca-issuer
    tls:
      enabled: true

  certificates:
    customCAs:
      - secret: mirecloud-ca       # ta CA

  psql:
    host: postgres.postgres.svc.cluster.local
    port: 5432
    database: gitlabhq_production
    username: gitlab
    password:
      useSecret: true
      secret: gitlab-postgres
      key: password

  minio:
    enabled: false                 # MinIO externe

  redis:
    host: redis.gitlab.svc.cluster.local   # le Redis qu'on va déployer
    auth:
      enabled: true
      secret: gitlab-redis
      key: password

  monitoring:
    enabled: true                  # génère les ServiceMonitors

  appConfig:
    object_store:
      enabled: true
      proxy_download: true
      connection:
        secret: gitlab-object-storage
        key: connection
    lfs:             { bucket: gitlab-lfs }
    artifacts:       { bucket: gitlab-artifacts }
    uploads:         { bucket: gitlab-uploads }
    packages:        { bucket: gitlab-packages }
    externalDiffs:   { bucket: gitlab-mr-diffs }
    terraformState:  { bucket: gitlab-terraform-state }
    ciSecureFiles:   { bucket: gitlab-ci-secure-files }
    dependencyProxy: { bucket: gitlab-dependency-proxy }
    backups:
      bucket: gitlab-backups
      tmpBucket: gitlab-tmp

# --- Registry -> MinIO ---
registry:
  hpa:
    minReplicas: 1
    maxReplicas: 1
  storage:
    secret: gitlab-registry-storage
    key: config
  ingress:
    tls:
      secretName: registry-tls

# --- Composants GitLab ---
gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
    ingress:
      tls:
        secretName: gitlab-tls
    metrics:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: prometheus-stack

  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    metrics:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: prometheus-stack

  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
    service:
      type: LoadBalancer           # IP du pool Cilium pour git en SSH

  gitaly:
    persistence:
      size: 20Gi

  gitlab-exporter:
    enabled: false

  toolbox:
    backups:
      objectStorage:
        config:
          secret: gitlab-backup-s3
          key: config