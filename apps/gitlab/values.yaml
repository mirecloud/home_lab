gitlab:
  # ... (Le début du fichier ne change pas : upgradeCheck, global, certificates, appConfig, ingress, psql, minio, redis ...)

  # --------------------------------------------------------
  # 6. OBSERVABILITÉ (CORRIGÉ - INDENTATION CRITIQUE)
  # --------------------------------------------------------

  webservice:
    metrics:
      enabled: true
      # 'serviceMonitor' DOIT être sous 'metrics' (2 espaces de plus)
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack

  sidekiq:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack

  gitlab-exporter:
    enabled: true
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack

  gitlab-shell:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack

  # --------------------------------------------------------
  # 7. COMPOSANTS DÉSACTIVÉS
  # --------------------------------------------------------

  prometheus:
    install: false # On désactive celui de GitLab car on utilise les ServiceMonitor ci-dessus

  postgresql:
    install: false

  gitlab-runner:
    install: false

  migrations:
    enabled: true
