global:
  hosts:
    domain: mirecloud.com
    gitlab:
      name: gitlab.mirecloud.com

  ingress:
    enabled: true
    provider: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: mirecloud-ca-issuer
    tls:
      secretName: gitlab-tls-auto

  certmanager:
    enabled: false

gitlab-runner:
  install: false

postgresql:
  install: false

psql:
  host: postgres.postgres.svc.cluster.local
  port: 5432
  username: postgres
  database: gitlab
  password:
    secret: gitlab-postgres-secret
    key: password
