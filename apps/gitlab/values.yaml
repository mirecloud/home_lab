gitlab:
  upgradeCheck:
    enabled: true

  global:
    common:
      check: false
    edition: ce
    hosts:
      domain: mirecloud.com
      https: true

    ingress:
      configureCertmanager: false
      class: nginx
      annotations:
        cert-manager.io/cluster-issuer: "mirecloud-ca-issuer"
        nginx.ingress.kubernetes.io/proxy-body-size: "512m"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      tls:
        enabled: true
        secretName: gitlab-tls

    psql:
      host: postgres.postgres.svc
      port: 5432
      username: postgres
      database: gitlab
      password:
        useSecret: true
        secret: gitlab-postgresql-password
        key: postgres-password

    minio:
      enabled: true

    redis:
      install: true

  migrations:
    enabled: true

  postgresql:
    install: false

  gitlab-runner:
    install: true
    rbac:
      create: true
