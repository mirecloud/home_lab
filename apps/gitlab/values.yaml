gitlab:
  # --------------------------------------------------------
  # 1. DÉSACTIVATION DES VÉRIFICATIONS & MAINTENANCE
  # --------------------------------------------------------
  upgradeCheck:
    enabled: false

  # --------------------------------------------------------
  # 2. CORRECTIF: LE PARAMÈTRE QUI BLOQUE
  # --------------------------------------------------------
  # On doit fournir un email pour satisfaire la validation du template Helm,
  # même si on utilise notre propre CertManager externe.
  certmanager-issuer:
    email: admin@mirecloud.com

  global:
    common:
      check: false

    edition: ce
    hosts:
      domain: mirecloud.com
      https: true

    # --------------------------------------------------------
    # 3. CERTIFICATS CUSTOM (SSO)
    # --------------------------------------------------------
    certificates:
      customCAs:
        - secret: gitlab-custom-ca-secret

    # --------------------------------------------------------
    # 4. CONFIGURATION SSO (KEYCLOAK)
    # --------------------------------------------------------
    appConfig:
      omniauth:
        enabled: true
        autoLinkUser: ["openid_connect"]
        allowSingleSignOn: ["openid_connect"]
        blockAutoCreatedUsers: false
        providers:
          - secret: gitlab-oidc-config
            key: provider

    # --------------------------------------------------------
    # 5. CONFIGURATION RESEAU & SSL
    # --------------------------------------------------------
    ingress:
      configureCertmanager: false # On gère nous-mêmes via les annotations ci-dessous
      class: nginx
      annotations:
        cert-manager.io/cluster-issuer: "mirecloud-ca-issuer"
        nginx.ingress.kubernetes.io/proxy-body-size: "512m"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
        nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
      tls:
        enabled: true
        secretName: gitlab-tls

    # --------------------------------------------------------
    # 6. BASE DE DONNÉES EXTERNE (CNPG)
    # --------------------------------------------------------
    psql:
      password:
        useSecret: true
        secret: gitlab-postgresql-password
        key: postgres-password
      host: postgres.postgres.svc
      port: 5432
      username: postgres
      database: gitlab

    # Minio Interne
    minio:
      enabled: true

    # Redis Interne
    redis:
      host: ""

  # --------------------------------------------------------
  # 7. OBSERVABILITÉ (CORRIGÉ)
  # --------------------------------------------------------

  webservice:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack

  sidekiq:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack

  gitlab-exporter:
    enabled: true
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack

  gitlab-shell:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack

  # --------------------------------------------------------
  # 8. COMPOSANTS DÉSACTIVÉS
  # --------------------------------------------------------

  # On désactive le Prometheus inclus (car on utilise ServiceMonitor)
  prometheus:
    install: false

  postgresql:
    install: false

  gitlab-runner:
    install: false

  migrations:
    enabled: true
