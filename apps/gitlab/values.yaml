gitlab:
  # --------------------------------------------------------
  # 1. DÉSACTIVATION DES CHECKS BLOQUANTS
  # --------------------------------------------------------
  upgradeCheck:
    enabled: false

  nginx-ingress:
    enabled: false
  # Obligatoire pour satisfaire le template Helm GitLab
  # (même si on n’utilise PAS le certmanager GitLab)
  certmanager-issuer:
    email: info@mirecloud.com

  # --------------------------------------------------------
  # 2. CONFIGURATION GLOBALE
  # --------------------------------------------------------
  global:
    common:
      check: false

    edition: ce

    hosts:
      domain: mirecloud.com
      https: true

    #  OBLIGATOIRE POUR ACTIVER LES METRICS PARTOUT
    metrics:
      enabled: true

    # Certificats custom (CA interne pour Keycloak)
    certificates:
      customCAs:
        - secret: gitlab-custom-ca-secret

    # --------------------------------------------------------
    # Base de données PostgreSQL EXTERNE (CNPG)
    # --------------------------------------------------------
    psql:
      host: postgres.postgres.svc
      port: 5432
      username: postgres
      database: gitlab
      password:
        useSecret: true
        secret: gitlab-postgresql-password
        key: postgres-password

    # MinIO interne GitLab
    minio:
      enabled: true

    # Redis interne GitLab
    redis:
      host: ""

  # --------------------------------------------------------
  # 3. SSO KEYCLOAK (OMNIAUTH)
  # --------------------------------------------------------
  appConfig:
    omniauth:
      enabled: true
      autoLinkUser:
        - openid_connect
      allowSingleSignOn:
        - openid_connect
      blockAutoCreatedUsers: false
      providers:
        - secret: gitlab-oidc-config
          key: provider

  # --------------------------------------------------------
  # 4. INGRESS & TLS
  # --------------------------------------------------------
  ingress:
    configureCertmanager: false
    class: nginx
    annotations:
      cert-manager.io/cluster-issuer: "mirecloud-ca-issuer"
      nginx.ingress.kubernetes.io/proxy-body-size: "512m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    tls:
      enabled: true
      secretName: gitlab-tls

  # --------------------------------------------------------
  # 5. OBSERVABILITÉ (SERVICE MONITORS)
  #  Le label DOIT matcher Prometheus :
  #     serviceMonitorSelector.matchLabels.release = prometheus-stack
  # --------------------------------------------------------

  webservice:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: prometheus-stack

  sidekiq:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: prometheus-stack

  gitlab-exporter:
    enabled: true
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: prometheus-stack

  gitlab-shell:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: prometheus-stack

  # --------------------------------------------------------
  # 6. COMPOSANTS DÉSACTIVÉS
  # --------------------------------------------------------

  # On utilise kube-prometheus-stack, pas celui de GitLab
  prometheus:
    install: false

  # DB interne désactivée (CNPG externe)
  postgresql:
    install: false

  # Runner géré hors cluster
  gitlab-runner:
    install: false

  # Migrations ACTIVÉES (DB fraîche)
  migrations:
    enabled: true
