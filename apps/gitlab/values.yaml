global:
  hosts:
    domain: mirecloud.com
    gitlab:
      name: gitlab.mirecloud.com

  ingress:
    enabled: true
    provider: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: mirecloud-ca-issuer
    tls:
      secretName: gitlab-tls-auto

  certificates:
    customCAs:
      - secret: secret-custom-ca

certmanager:
  enabled: false

nginx-ingress:
  enabled: false

prometheus:
  install: false

gitlab-runner:
  install: false

postgresql:
  install: false

redis:
  install: true

psql:
  host: postgres.postgres.svc.cluster.local
  port: 5432
  username: postgres
  database: gitlab
  password:
    secret: gitlab-postgres
    key: password
