apiVersion: external-secrets.io/v1  # <--- CORRECTION 1 : v1 (plus v1beta1)
kind: ExternalSecret
metadata:
  name: keycloak-db-es
  namespace: keycloak
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: byo-db-creds      # Le nom attendu par Keycloak
    creationPolicy: Owner
  data:
  - secretKey: password
    remoteRef:
      # CORRECTION 2 : Ajout de /data/ pour le moteur KV v2
      key: secret/data/keycloak/db
      property: password

---
apiVersion: external-secrets.io/v1  # <--- CORRECTION 1 : v1
kind: ExternalSecret
metadata:
  name: keycloak-admin-es
  namespace: keycloak
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keycloak-admin-password
    creationPolicy: Owner
  data:
  - secretKey: password
    remoteRef:
      # CORRECTION 2 : Ajout de /data/
      key: secret/data/keycloak/admin
      property: password