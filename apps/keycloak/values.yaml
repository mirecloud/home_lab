keycloakx:
  command:
    - /opt/keycloak/bin/kc.sh
    - start
    - '--http-enabled=true'
    - '--http-port=8080'
    # Force le scheme+host public → issuer OIDC en https (fix du 500 Open WebUI)
    - '--hostname=https://keycloak.mirecloud.com'
    - '--hostname-strict=false'
    - '--proxy-headers=xforwarded'

  replicas: 1

  # Ici, on fait référence aux secrets qui seront créés par ExternalSecrets
  extraEnv: |
    - name: KEYCLOAK_ADMIN
      value: admin
    - name: KEYCLOAK_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keycloak-admin-password # Créé par l'ExternalSecret
          key: password

  dbchecker:
    enabled: true

  database:
    vendor: postgres
    hostname: postgres.postgres.svc
    port: 5432
    database: postgres
    username: postgres
    existingSecret: byo-db-creds # Créé par l'ExternalSecret
    #tls:
    #- secretName: keycloak-tls-cert
    #hosts:
    #  - keycloak.mirecloud.com

  service:
    type: LoadBalancer