keycloakx:
  # Commande de démarrage
  command:
    - "/opt/keycloak/bin/kc.sh"

  args:
    - "start"

  replicas: 2

  # CORRECTION ICI : Le pipe "|" transforme tout ce qui suit en une seule chaîne de texte (String)
  # C'est ce que le chart attend, au lieu d'une liste YAML directe.
  extraEnv: |
    - name: KEYCLOAK_ADMIN
      value: "admin"
    - name: KEYCLOAK_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keycloak-admin-password
          key: password
    - name: KC_HOSTNAME
      value: "keycloak.mirecloud.com"
    - name: KC_HOSTNAME_STRICT
      value: "false"
    - name: KC_HTTP_ENABLED
      value: "true"
    - name: KC_PROXY
      value: "edge"

  dbchecker:
    enabled: true

  database:
    vendor: postgres
    hostname: postgres.postgres.svc
    port: 5432
    database: postgres
    username: postgres
    existingSecret: byo-db-creds

  ingress:
    enabled: true
    ingressClassName: cilium
    annotations:
      cert-manager.io/cluster-issuer: mirecloud-ca-issuer
    rules:
      - host: keycloak.mirecloud.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: keycloak-tls-cert
        hosts:
          - keycloak.mirecloud.com

  service:
    type: ClusterIP
    ports:
      http:
        port: 80
        targetPort: 8080
