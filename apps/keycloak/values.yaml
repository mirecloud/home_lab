keycloakx:
  command:
    - "/opt/keycloak/bin/kc.sh"
    - "start"
    - "--http-enabled=true"
    - "--http-port=8080"
    - "--hostname-strict=false"
    - "--proxy-headers=xforwarded"

  replicas: 2

  # Ici, on fait référence aux secrets qui seront créés par ExternalSecrets
  extraEnv: |
    - name: KEYCLOAK_ADMIN
      value: admin
    - name: KEYCLOAK_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keycloak-admin-password # Créé par l'ExternalSecret
          key: password
    - name: KC_PROXY
      value: edge

  dbchecker:
    enabled: true

  database:
    vendor: postgres
    hostname: postgres.postgres.svc
    port: 5432
    database: postgres
    username: postgres
    existingSecret: byo-db-creds # Créé par l'ExternalSecret

  ingress:
    enabled: true
    ingressClassName: cilium
    annotations:
      # C'est parfait, il va utiliser ton nouveau Issuer Vault/CA
      cert-manager.io/cluster-issuer: "mirecloud-ca-issuer"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    rules:
      - host: keycloak.mirecloud.com
        paths:
          - path: /
            pathType: Prefix
    #tls:
    #- secretName: keycloak-tls-cert
    #hosts:
    #  - keycloak.mirecloud.com

  service:
    type: LoadBalancer
