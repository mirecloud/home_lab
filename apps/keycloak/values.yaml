extraEnv: |
  - name: KEYCLOAK_ADMIN
    value: admin
  - name: KEYCLOAK_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-admin-password
        key: password

dbchecker:
  enabled: true

database:
  vendor: postgres
  hostname: postgres.postgres.svc
  port: 5432
  database: postgres
  username: postgres
  existingSecret: byo-db-creds # Password is retrieved via .passwor

command:
  - "/opt/keycloak/bin/kc.sh"
  - "start"
  - "--http-port=8080"
  - "--hostname-strict=false"
