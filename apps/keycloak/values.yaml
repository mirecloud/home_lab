keycloakx:
  # 1. On sépare la commande et l'argument pour forcer le "start"
  # C'est ça qui corrige le bug où Keycloak affichait juste l'aide et s'arrêtait.
  command:
    - "/opt/keycloak/bin/kc.sh"

  args:
    - "start"

  replicas: 2

  # 2. Configuration via Variables d'Env (Plus propre que les arguments)
  extraEnv:
    # --- Admin ---
    - name: KEYCLOAK_ADMIN
      value: "admin"
    - name: KEYCLOAK_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keycloak-admin-password
          key: password

    # --- Configuration Réseau & Hostname ---
    - name: KC_HOSTNAME
      value: "keycloak.mirecloud.com"
    - name: KC_HOSTNAME_STRICT
      value: "false"
    - name: KC_HTTP_ENABLED
      value: "true"

    # --- Configuration Proxy (CRUCIAL pour Cilium/Ingress) ---
    # "edge" dit à Keycloak : "Je suis derrière un Ingress qui gère le SSL, fais-lui confiance"
    - name: KC_PROXY
      value: "edge"

  # 3. Base de données
  dbchecker:
    enabled: true

  database:
    vendor: postgres
    hostname: postgres.postgres.svc
    port: 5432
    database: postgres
    username: postgres
    existingSecret: byo-db-creds

  # 4. Ingress (Exposition externe)
  ingress:
    enabled: true
    ingressClassName: cilium
    annotations:
      cert-manager.io/cluster-issuer: mirecloud-ca-issuer
    rules:
      - host: keycloak.mirecloud.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: keycloak-tls-cert
        hosts:
          - keycloak.mirecloud.com

  # 5. Service Interne
  service:
    type: ClusterIP
    ports:
      http:
        port: 80
        targetPort: 8080
