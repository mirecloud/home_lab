# AVANT : keycloak:
# APRÈS (CORRECT) :
keycloakx:
  # Commande de démarrage (Toujours indispensable)
  command:
    - "/opt/keycloak/bin/kc.sh"
    - "start"
    - "--http-enabled=true"
    - "--http-port=8080"
    - "--hostname-strict=false"
    - "--proxy-headers=xforwarded"

  # Le reste ne change pas, assure-toi juste que tout est bien indenté sous "keycloakx:"
  replicas: 1

  extraEnv: |
    - name: KEYCLOAK_ADMIN
      value: admin
    - name: KEYCLOAK_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keycloak-admin-password
          key: password
    - name: KC_PROXY
      value: edge

  dbchecker:
    enabled: true

  database:
    vendor: postgres
    hostname: postgres.postgres.svc
    port: 5432
    database: postgres
    username: postgres
    existingSecret: byo-db-creds

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "mirecloud-ca-issuer"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    rules:
      - host: keycloak.mirecloud.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: keycloak-tls-cert
        hosts:
          - keycloak.mirecloud.com

  service:
    type: ClusterIP
