# Configuration propre pour Keycloak (Chart keycloakx)
replicas: 2

command:
  - "/opt/keycloak/bin/kc.sh"
  - "start"
  - "--http-enabled=true"
  - "--http-port=8080"
  - "--hostname=keycloak.mirecloud.com" # Définit l'URL publique
  - "--hostname-strict=false" # Permet plus de souplesse interne
  - "--proxy-headers=xforwarded" # INDISPENSABLE derrière un Ingress (Cilium)

# Variables d'environnement (Secrets & Admin)
extraEnv: |
  - name: KEYCLOAK_ADMIN
    value: admin
  - name: KEYCLOAK_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-admin-password
        key: password
  # Note: J'ai retiré KC_HOSTNAME_URL pour éviter les conflits avec la commande ci-dessus

# Vérificateur de base de données (utile pour attendre que Postgres soit prêt)
dbchecker:
  enabled: true

# Connexion à ta base Postgres externe
database:
  vendor: postgres
  hostname: postgres.postgres.svc
  port: 5432
  database: postgres
  username: postgres
  existingSecret: byo-db-creds

# Configuration de l'accès externe (Ingress)
ingress:
  enabled: true
  ingressClassName: cilium
  annotations:
    # Lien avec ton Issuer Vault/Cert-Manager
    cert-manager.io/cluster-issuer: mirecloud-ca-issuer
  rules:
    - host: keycloak.mirecloud.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: keycloak-tls-cert
      hosts:
        - keycloak.mirecloud.com

# Configuration du Service interne
service:
  type: ClusterIP
  ports:
    http:
      port: 80
      targetPort: 8080
