keycloak:
  # 1. LA COMMANDE DE DÉMARRAGE (CRITIQUE : Sans ça, le pod s'éteint)
  command:
    - "/opt/keycloak/bin/kc.sh"
    - "start"
    - "--http-enabled=true" # Active le HTTP (car TLS est géré par l'Ingress)
    - "--http-port=8080"
    - "--hostname-strict=false" # Permet d'accepter le trafic venant de l'Ingress sans bloquer
    - "--proxy-headers=xforwarded" # Important derrière un Ingress NGINX

  # 2. Ton Admin (Validé)
  extraEnv: |
    - name: KEYCLOAK_ADMIN
      value: admin
    - name: KEYCLOAK_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keycloak-admin-password
          key: password

  # 3. Ta Base de données (Validé - Utilise les fonctionnalités natives du chart)
  dbchecker:
    enabled: true

  database:
    vendor: postgres
    hostname: postgres.postgres.svc
    port: 5432
    database: postgres
    username: postgres
    existingSecret: byo-db-creds # Le secret qu'on a créé avec la clé 'password'

  # 4. Ton Ingress (Pour accéder à l'interface)
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      # Pour éviter les erreurs 502/Bad Gateway courantes avec Keycloak
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    rules:
      - host: keycloak.mirecloud.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: wildcard-mirecloud
        hosts:
          - keycloak.mirecloud.com

  # 5. Service
  service:
    type: ClusterIP
