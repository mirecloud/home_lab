keycloakx:
  replicas: 2

  command:
    - "/opt/keycloak/bin/kc.sh"
    - "start"
    - "--http-enabled=true"
    - "--http-port=8080"
    - "--hostname=keycloak.mirecloud.com"
    - "--hostname-strict=false"
    - "--proxy-headers=xforwarded"

  extraEnv: |
    - name: KEYCLOAK_ADMIN
      value: admin
    - name: KEYCLOAK_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keycloak-admin-password
          key: password
    - name: KC_HOSTNAME_URL
      value: https://keycloak.mirecloud.com

  dbchecker:
    enabled: true

  database:
    vendor: postgres
    hostname: postgres.postgres.svc
    port: 5432
    database: postgres
    username: postgres
    existingSecret: byo-db-creds

  ingress:
    enabled: true
    ingressClassName: cilium
    annotations:
      cert-manager.io/cluster-issuer: mirecloud-ca-issuer
    rules:
      - host: keycloak.mirecloud.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: keycloak-tls-cert
        hosts:
          - keycloak.mirecloud.com

  service:
    type: ClusterIP
    ports:
      http:
        port: 80
        targetPort: 8080
