keycloak:
  # Tes identifiants initiaux
  adminUser: admin
  adminPassword: "admin"
  hostname: "keycloak.mirecloud.com"
  proxyHeaders: "xforwarded"
  production: true

  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      cert-manager.io/cluster-issuer: "mirecloud-ca-issuer"
    hosts:
      - host: keycloak.mirecloud.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: keycloak-tls-auto
        hosts:
          - keycloak.mirecloud.com

database:
  type: postgres
  host: "postgres.postgres.svc"
  port: "5432"
  name: "postgres"
  existingSecret: "keycloak-db"
  secretKeys:
    usernameKey: "db-username"
    passwordKey: "db-password"

postgres:
  enabled: false
mariadb:
  enabled: false
