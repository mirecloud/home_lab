n8n:
  # 1. Base de données
  db:
    type: postgresdb
    postgresdb:
      connectionTimeout: 10000

  # CORRECTION MAJEURE : externalPostgresql est au même niveau que db, pas dedans.
  externalPostgresql:
    host: "postgres.postgres.svc"
    port: 5432
    database: "n8n"
    username: "postgres"
    existingSecret: "n8n-db-creds"

  # 2. Main Node (Interface Web + Webhooks)
  main:
    # CORRECTION : La persistance va ici
    persistence:
      enabled: true
      accessMode: ReadWriteMany
      size: 5Gi
      mountPath: "/home/node/.n8n"

    # CORRECTION : extraEnvVars est un OBJET (Map), pas une liste
    extraEnvVars:
      N8N_HOST: "n8n.mirecloud.com"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "https"
      WEBHOOK_URL: "https://n8n.mirecloud.com/"
      GENERIC_TIMEZONE: "America/Toronto"
      N8N_ENCRYPTION_KEY: "MireCloud_Key_A_Ne_Jamais_Perdre"
      # Désactiver la gestion SSL interne de n8n car NGINX gère le TLS
      N8N_SECURE_COOKIE: "false"

  # 3. Workers (Exécution des tâches lourdes)
  worker:
    mode: queue
    count: 2
    concurrency: 20
    # Les workers ont aussi besoin des mêmes variables d'env critiques (DB, Key, etc)
    # Le chart propage souvent les configs, mais pour la clé de chiffrement, mieux vaut être sûr.
    extraEnvVars:
      N8N_ENCRYPTION_KEY: "MireCloud_Key_A_Ne_Jamais_Perdre"
      GENERIC_TIMEZONE: "America/Toronto"

  # 4. Redis (Broker)
  redis:
    enabled: true
    architecture: standalone
    auth:
      enabled: true
      password: "RedisStrongPassword123!"

  # 5. Ingress
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "mirecloud-ca-issuer"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    hosts:
      - host: n8n.mirecloud.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: n8n-tls-cert
        hosts:
          - n8n.mirecloud.com
