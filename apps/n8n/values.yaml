# Note la clé racine "n8n". C'est elle qui dit à Helm :
# "Ces configs sont pour le sous-chart n8n que j'ai déclaré dans Chart.yaml"
n8n:
  # --- Base de données (Validé, ça marche !) ---
  db:
    type: postgresdb
    postgresdb:
      connectionTimeout: 10000
    externalPostgresql:
      host: "postgres.postgres.svc"
      port: 5432
      database: "n8n"
      username: "postgres"
      existingSecret: "n8n-db-creds"

  # --- Workers & Queue (Performance) ---
  worker:
    mode: queue
    count: 2
    concurrency: 20

  # --- Redis (Requis pour le mode queue) ---
  redis:
    enabled: true
    architecture: standalone
    auth:
      enabled: true
      password: "RedisStrongPassword123!"

  # --- Ingress (C'est ici que ça bloquait) ---
  ingress:
    enabled: true
    className: "nginx" #
    annotations:
      cert-manager.io/cluster-issuer: "mirecloud-ca-issuer"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    hosts:
      - host: n8n.mirecloud.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: n8n-tls-cert
        hosts:
          - n8n.mirecloud.com

  # --- Persistance ---
  persistence:
    enabled: true
    accessMode: ReadWriteMany
    size: 5Gi

  # --- Environment ---
  extraEnvVars:
    - name: N8N_HOST
      value: "n8n.mirecloud.com"
    - name: N8N_PORT
      value: "5678"
    - name: N8N_PROTOCOL
      value: "https"
    - name: WEBHOOK_URL
      value: "https://n8n.mirecloud.com/"
    - name: GENERIC_TIMEZONE
      value: "America/Toronto"
    - name: N8N_ENCRYPTION_KEY
      value: "MireCloud_Key_A_Ne_Jamais_Perdre"
