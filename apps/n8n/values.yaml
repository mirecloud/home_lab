n8n:
  db:
    type: postgresdb

  postgresql:
    enabled: false

  externalPostgresql:
    host: "postgres.postgres.svc"
    port: 5432
    database: "n8n"
    username: "postgres"
    existingSecret: "n8n-db-creds"

  main:
    persistence:
      enabled: true
      storageClass: nfs-client
      accessMode: ReadWriteOnce        # ← was ReadWriteMany; RWX + count=1 → chart never renders the PVC
      size: 5Gi

    extraEnvVars:
      N8N_HOST: "n8n.mirecloud.com"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "https"
      WEBHOOK_URL: "https://n8n.mirecloud.com/"
      GENERIC_TIMEZONE: "America/Toronto"
      N8N_SECURE_COOKIE: "false"

  worker:
    mode: queue
    count: 2
    concurrency: 20

  redis:
    enabled: true
    architecture: standalone
    auth:
      enabled: true
      existingSecret: "n8n-redis-creds"
      existingSecretPasswordKey: "redis-password"   # ← was "password"; must match the key n8n pods read

  externalRedis:
    host: "n8n-redis-master"
    port: 6379
    username: "default"
    existingSecret: "n8n-redis-creds"