apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "vault-backend"   # <--- C'ÉTAIT ÇA TON ERREUR (C'était "argocd-role")
          serviceAccountRef:
            name: "external-secrets" # Le nom du SA de l'opérateur dans le namespace external-secrets
            namespace: "external-secrets" # OBLIGATOIRE si ClusterSecretStore