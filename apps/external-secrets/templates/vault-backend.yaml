apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  annotations:
    # On garde la vague 5 pour être sûr qu'il passe APRES l'install
    argocd.argoproj.io/sync-wave: "5"
    # C'EST LA LIGNE QUI TE SAUVE LA VIE :
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "vault-backend"
          serviceAccountRef:
            name: "ext-secrets-external-secrets"
            namespace: "external-secrets"